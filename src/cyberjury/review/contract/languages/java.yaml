extensions: [.java]
grammar: [tree_sitter_java, language]
files:
  ignored_dirs: [.gradle]
  lockfiles: [gradle.lockfile]
syntax:
  definitions: |
    [(class_declaration name: (identifier) @name)
     (interface_declaration name: (identifier) @name)
     (enum_declaration name: (identifier) @name)
     (record_declaration name: (identifier) @name)
     (annotation_type_declaration name: (identifier) @name)
     (method_declaration name: (identifier) @name)
     (constructor_declaration name: (identifier) @name)] @def
  type_definitions: |
    [(class_declaration name: (identifier) @name)
     (interface_declaration name: (identifier) @name)
     (enum_declaration name: (identifier) @name)
     (record_declaration name: (identifier) @name)] @type
  structural_relationships:
  - kind: inheritance
    query: |
      (class_declaration
        name: (identifier) @owner_name
        superclass: (superclass (type_identifier) @reference @target_name)) @owner
  - kind: inheritance
    query: |
      (class_declaration
        name: (identifier) @owner_name
        interfaces: (super_interfaces (type_list (type_identifier) @reference @target_name))) @owner
  calls: |
    (method_invocation !object name: (identifier) @callee arguments: (argument_list)) @call
    (method_invocation object: (_) @receiver name: (identifier) @member arguments: (argument_list)) @call
    (object_creation_expression type: (type_identifier) @callee arguments: (argument_list)) @call
