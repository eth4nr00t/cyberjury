extensions: [.cc, .cpp, .cxx, .h, .hh, .hpp, .hxx]
grammar: [tree_sitter_cpp, language]
files:
  dependency_dirs: [3rdparty, third_party]
  test_name_patterns: ['*_test.cc', '*_test.cpp', '*_test.cxx', '*_unittest.cc', '*_unittest.cpp', '*_unittest.cxx']
  lockfiles: [conan.lock]
syntax:
  definitions: |
    [(function_definition declarator: (function_declarator declarator: (identifier) @name))
     (function_definition declarator: (function_declarator declarator: (field_identifier) @name))
     (function_definition declarator: (function_declarator declarator: (qualified_identifier name: (identifier) @name)))
     (function_definition declarator: (function_declarator
       declarator: (qualified_identifier name: (qualified_identifier name: (identifier) @name))))
     (function_definition declarator: (pointer_declarator declarator: (function_declarator declarator: (identifier) @name)))
     (function_definition declarator: (reference_declarator (function_declarator declarator: (identifier) @name)))
     (class_specifier name: (type_identifier) @name body: (field_declaration_list))
     (struct_specifier name: (type_identifier) @name body: (field_declaration_list))
     (union_specifier name: (type_identifier) @name body: (field_declaration_list))
     (enum_specifier name: (type_identifier) @name body: (enumerator_list))
     (namespace_definition name: (namespace_identifier) @name)
     (type_definition declarator: (type_identifier) @name)
     (alias_declaration name: (type_identifier) @name)] @def
  type_definitions: |
    [(class_specifier name: (type_identifier) @name body: (field_declaration_list))
     (struct_specifier name: (type_identifier) @name body: (field_declaration_list))
     (union_specifier name: (type_identifier) @name body: (field_declaration_list))
     (enum_specifier name: (type_identifier) @name body: (enumerator_list))
     (type_definition declarator: (type_identifier) @name)
     (alias_declaration name: (type_identifier) @name)] @type
  structural_relationships:
  - kind: inheritance
    query: |
      (class_specifier
        name: (type_identifier) @owner_name
        (base_class_clause (type_identifier) @reference @target_name)) @owner
  - kind: inheritance
    query: |
      (struct_specifier
        name: (type_identifier) @owner_name
        (base_class_clause (type_identifier) @reference @target_name)) @owner
  calls: |
    (call_expression function: (identifier) @callee arguments: (argument_list) @arguments) @call
    (call_expression function: (field_expression argument: (_) @receiver field: (field_identifier) @member)
      arguments: (argument_list) @arguments) @call
    (call_expression function: (qualified_identifier scope: (_) @receiver name: (identifier) @member)
      arguments: (argument_list) @arguments) @call
  qualified_uses: |
    (qualified_identifier scope: (namespace_identifier) @qualifier name: (identifier) @name)
