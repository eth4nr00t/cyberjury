extensions: [.c]
grammar: [tree_sitter_c, language]
files:
  test_name_patterns:
    - "*_test.c"
    - "*_unittest.c"
  lockfiles:
    - conan.lock
syntax:
  definitions: |
    [(function_definition declarator: (function_declarator declarator: (identifier) @name))
     (function_definition declarator: (pointer_declarator declarator: (function_declarator declarator: (identifier) @name)))
     (struct_specifier name: (type_identifier) @name body: (field_declaration_list))
     (union_specifier name: (type_identifier) @name body: (field_declaration_list))
     (enum_specifier name: (type_identifier) @name body: (enumerator_list))
     (type_definition declarator: (type_identifier) @name)] @def
  type_definitions: |
    [(struct_specifier name: (type_identifier) @name body: (field_declaration_list))
     (union_specifier name: (type_identifier) @name body: (field_declaration_list))
     (enum_specifier name: (type_identifier) @name body: (enumerator_list))
     (type_definition declarator: (type_identifier) @name)] @type
  calls: |
    (call_expression function: (identifier) @callee arguments: (argument_list)) @call
    (call_expression function: (field_expression argument: (_) @receiver field: (field_identifier) @member)
      arguments: (argument_list)) @call
