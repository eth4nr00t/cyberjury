skip_dirs:
  - ".git"
  - "__pycache__"
  - ".venv"
  - "venv"
  - ".eggs"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".tox"
  - "node_modules"
  - ".next"
  - ".nuxt"
  - "vendor"
  - "build"
  - "dist"
  - "out"
  - "coverage"
  - "htmlcov"

source_extensions:
  - ".py"
  - ".js"
  - ".jsx"
  - ".mjs"
  - ".cjs"
  - ".ts"
  - ".tsx"
  - ".mts"
  - ".cts"
  - ".go"

asset_extensions:
  - ".css"
  - ".po"
  - ".scss"
  - ".svg"
  - ".xlf"

test_dirs:
  - "__mocks__"
  - "__tests__"
  - "e2e"
  - "spec"
  - "specs"
  - "test"
  - "testdata"
  - "tests"

test_name_patterns:
  - "*_test.*"
  - "*.test.*"
  - "*.spec.*"
  - "test_*"

doc_extensions:
  - ".adoc"
  - ".markdown"
  - ".md"
  - ".mdx"
  - ".rst"
  - ".txt"

lockfiles:
  - "package-lock.json"
  - "npm-shrinkwrap.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "bun.lock"
  - "bun.lockb"
  - "deno.lock"
  - "poetry.lock"
  - "Pipfile.lock"
  - "pdm.lock"
  - "uv.lock"
  - "go.sum"
