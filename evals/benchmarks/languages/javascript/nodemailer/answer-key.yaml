schema_version: 1

target: nodemailer

planted:
  - id: oauth2-fetch-tls-verify-disabled
    category: insecure-transport
    files:
      - lib/fetch/index.js
    severity: MEDIUM
    symbols:
      - nmfetch
    note: >-
      GHSA-r7g4-qg5f-qqm2. The shared HTTPS request builder nmfetch sets rejectUnauthorized: false
      unconditionally, so TLS certificate validation is disabled. lib/xoauth2/index.js builds the
      OAuth2 token-refresh body with client_id, client_secret, and refresh_token and POSTs it
      through nmfetch with no tls override, so a man in the middle presenting any certificate
      intercepts the OAuth2 exchange and steals the client secret, refresh token, and access token.
      The fix enforces rejectUnauthorized: true on the credential requests.
    knowledge:
      vulnerabilities:
        - insecure-transport
      guides:
        - languages/javascript
