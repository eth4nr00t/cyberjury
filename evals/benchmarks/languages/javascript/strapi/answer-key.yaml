schema_version: 1

target: strapi

planted:
  - id: cognito-jwt-decode-no-verify
    category: jwt-validation
    files:
      - packages/plugins/users-permissions/server/services/providers-registry.js
    severity: CRITICAL
    symbols:
      - cognito
    note: >-
      CVE-2023-22893. The AWS Cognito login provider does const tokenPayload = jwt.decode(idToken)
      and then trusts tokenPayload['cognito:username'] and tokenPayload.email to authenticate the
      user. jwt.decode performs no signature check and accepts any algorithm, so an attacker forges
      an id token with arbitrary claims and logs in as any user, an authentication bypass. The fix
      verifies the token with jwt.verify against the Cognito JWKS and a fixed RS256 algorithm.
    knowledge:
      vulnerabilities:
        - jwt-validation
      guides:
        - languages/javascript
