schema_version: 1
target: goodentry-v3proxy


planted:
  - id: v3proxy-unchecked-eth-call
    category: unchecked-low-level-call
    files:
      - contracts/helper/V3Proxy.sol
    severity: MEDIUM
    note: >-
      C4 M-08, return value of low level call not checked. V3Proxy returns leftover or output
      ETH to the caller with payable(msg.sender).call{value: ...}("") and ignores the returned
      success at swapETHForExactTokens, swapTokensForExactETH, and swapExactTokensForETH, so a
      recipient whose fallback reverts or runs out of gas loses the ETH while the swap is
      reported as complete.
    knowledge:
      vulnerabilities:
        - unchecked-low-level-call
      guides:
        - languages/solidity
