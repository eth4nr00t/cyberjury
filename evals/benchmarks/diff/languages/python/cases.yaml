# The shipped Python diff probe cases, synthetic and authored here, not third-party, so
# they ship publicly. A positive carries a category and should yield a finding, a safe
# case carries none and must stay clean. Every row names the knowledge it exercises so the
# coverage matrix attributes it. The loader concatenates every cases.yaml under
# benchmarks/diff, so a language file joins the library without any wiring.
cases:
  - name: sqli
    category: sql-injection
    knowledge:
      vulnerabilities: [sql-injection]
    tags: [injection, python, smoke]
    diff: |
      diff --git a/app.py b/app.py
      --- a/app.py
      +++ b/app.py
      @@ -10,3 +10,4 @@ def get_user(name):
      -    return None
      +    q = "SELECT * FROM users WHERE name = '" + name + "'"
      +    return db.execute(q).fetchone()

  - name: cmdi
    category: command-injection
    knowledge:
      vulnerabilities: [command-injection]
    tags: [injection, python]
    diff: |
      diff --git a/ops.py b/ops.py
      --- a/ops.py
      +++ b/ops.py
      @@ -4,2 +4,3 @@ def ping(host):
      -    pass
      +    import os
      +    os.system("ping -c 1 " + host)

  - name: code-injection
    category: code-injection
    knowledge:
      vulnerabilities: [code-injection]
    tags: [injection, python]
    diff: |
      diff --git a/calc.py b/calc.py
      --- a/calc.py
      +++ b/calc.py
      @@ -3,2 +3,3 @@ def evaluate(req):
      -    return 0
      +    expr = req.args.get("expr")
      +    return eval(expr)

