# The shipped Solidity diff probe cases, synthetic and authored here, not third-party, so
# they ship publicly. Each case runs under the evm domain, so it scores against the EVM
# knowledge and prompt, not the web default. A positive carries a category and should yield
# a finding, a safe sibling carries none and must stay clean, the pair guards a class
# against both a miss and a false positive. The loader concatenates every cases.yaml under
# benchmarks/diff, so this file joins the library without any wiring.
cases:
  - name: evm-reentrancy
    domain: evm
    category: reentrancy
    knowledge:
      vulnerabilities: [reentrancy]
      guides: [languages/solidity]
    tags: [evm, solidity, reentrancy]
    diff: |
      diff --git a/Vault.sol b/Vault.sol
      --- a/Vault.sol
      +++ b/Vault.sol
      @@ -20,3 +20,7 @@ contract Vault {
      -    function withdraw(uint256 amount) external {
      -        require(balances[msg.sender] >= amount);
      -    }
      +    function withdraw(uint256 amount) external {
      +        require(balances[msg.sender] >= amount, "insufficient");
      +        (bool ok, ) = msg.sender.call{value: amount}("");
      +        require(ok, "transfer failed");
      +        balances[msg.sender] -= amount;
      +    }

