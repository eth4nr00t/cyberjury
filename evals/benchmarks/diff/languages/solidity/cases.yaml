  # read-only reentrancy, a sub-case of reentrancy, the view is read mid-update
  - name: evm-read-only-reentrancy
    domain: evm
    category: reentrancy
    knowledge:
      vulnerabilities: [reentrancy]
      guides: [languages/solidity, protocols/defi-primitives]
    tags: [evm, solidity, reentrancy, read-only]
    diff: |
      diff --git a/Pool.sol b/Pool.sol
      --- a/Pool.sol
      +++ b/Pool.sol
      @@ -30,3 +30,10 @@ contract Pool {
      -    function exit(uint256 shares) external {
      -    }
      +    function exit(uint256 shares) external {
      +        uint256 amount = (shares * address(this).balance) / totalShares;
      +        (bool ok, ) = msg.sender.call{value: amount}("");    // external call before the state sync
      +        require(ok);
      +        totalShares -= shares;                               // price is stale during the callback
      +    }
      +    function sharePrice() external view returns (uint256) {
      +        return (address(this).balance * 1e18) / totalShares; // a reenter reads the stale price
      +    }

  - name: safe-evm-read-only-reentrancy
    domain: evm
    knowledge:
      vulnerabilities: [reentrancy]
      guides: [languages/solidity, protocols/defi-primitives]
    tags: [evm, solidity, reentrancy, read-only, safe]
    diff: |
      diff --git a/Pool.sol b/Pool.sol
      --- a/Pool.sol
      +++ b/Pool.sol
      @@ -30,3 +30,10 @@ contract Pool {
      -    function exit(uint256 shares) external {
      -    }
      +    function exit(uint256 shares) external nonReentrant {
      +        uint256 amount = (shares * address(this).balance) / totalShares;
      +        totalShares -= shares;                               // effects before the external call
      +        (bool ok, ) = msg.sender.call{value: amount}("");
      +        require(ok);
      +    }
      +    function sharePrice() external view returns (uint256) {
      +        return (address(this).balance * 1e18) / totalShares; // ratio stays consistent, never mid-update
      +    }

  # ERC-4626 first-depositor share inflation, a sub-case of accounting-precision
  - name: evm-vault-share-inflation
    domain: evm
    category: accounting-precision
    knowledge:
      vulnerabilities: [accounting-precision]
      guides: [languages/solidity, protocols/erc-standards]
    tags: [evm, solidity, accounting, erc4626]
    diff: |
      diff --git a/Vault.sol b/Vault.sol
      --- a/Vault.sol
      +++ b/Vault.sol
      @@ -22,3 +22,6 @@ contract Vault {
      -    function deposit(uint256 assets) external returns (uint256 shares) {
      -    }
      +    function deposit(uint256 assets) external returns (uint256 shares) {
      +        shares = totalSupply == 0 ? assets : (assets * totalSupply) / asset.balanceOf(address(this));
      +        asset.transferFrom(msg.sender, address(this), assets);
      +        _mint(msg.sender, shares);   // first depositor donates to inflate, a later deposit rounds to 0
      +    }

  - name: safe-evm-vault-share-inflation
    domain: evm
    knowledge:
      vulnerabilities: [accounting-precision]
      guides: [languages/solidity, protocols/erc-standards]
    tags: [evm, solidity, accounting, erc4626, safe]
    diff: |
      diff --git a/Vault.sol b/Vault.sol
      --- a/Vault.sol
      +++ b/Vault.sol
      @@ -22,3 +22,8 @@ contract Vault {
      -    function deposit(uint256 assets) external returns (uint256 shares) {
      -    }
      +    function deposit(uint256 assets) external nonReentrant returns (uint256 shares) {
      +        uint256 totalBefore = asset.balanceOf(address(this));
      +        require(asset.transferFrom(msg.sender, address(this), assets), "transfer failed");
      +        uint256 received = asset.balanceOf(address(this)) - totalBefore;   // fee-on-transfer safe
      +        shares = (received * (totalSupply + 1)) / (totalBefore + 1);   // virtual offset on pre-deposit assets
      +        require(shares > 0, "zero shares");
      +        _mint(msg.sender, shares);
      +    }
