# The shipped JavaScript diff probe cases, synthetic and authored here, not third-party, so
# they ship publicly. A positive carries a category and should yield a finding, a safe
# case carries none and must stay clean. Every row names the knowledge it exercises so the
# coverage matrix attributes it. The loader concatenates every cases.yaml under
# benchmarks/diff, so a language file joins the library without any wiring.
cases:
  - name: cmdi-js
    category: command-injection
    knowledge:
      vulnerabilities: [command-injection]
    tags: [injection, javascript]
    diff: |
      diff --git a/run.js b/run.js
      --- a/run.js
      +++ b/run.js
      @@ -4,2 +4,3 @@ function ping(req) {
      -  return
      +  const { exec } = require('child_process')
      +  exec('ping -c 1 ' + req.query.host, cb)

