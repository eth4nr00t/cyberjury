    tags: [prototype-pollution, javascript]
    diff: |
      diff --git a/merge.js b/merge.js
      --- a/merge.js
      +++ b/merge.js
      @@ -3,2 +3,5 @@ function merge(target, source) {
      -  return target
      +  for (const k in source) {
      +    if (typeof source[k] === 'object') merge(target[k] = target[k] || {}, source[k])
      +    else target[k] = source[k]
      +  }

  - name: safe-prototype-pollution-js
    knowledge:
      vulnerabilities: [prototype-pollution]
    tags: [prototype-pollution, javascript, safe]
    diff: |
      diff --git a/merge.js b/merge.js
      --- a/merge.js
      +++ b/merge.js
      @@ -3,2 +3,6 @@ function merge(target, source) {
      -  return target
      +  for (const k in source) {
      +    if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue
      +    if (typeof source[k] === 'object') merge(target[k] = target[k] || {}, source[k])
      +    else target[k] = source[k]
      +  }

