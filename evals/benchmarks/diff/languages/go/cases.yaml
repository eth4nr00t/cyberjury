# The shipped Go diff probe cases, synthetic and authored here, not third-party, so
# they ship publicly. A positive carries a category and should yield a finding, a safe
# case carries none and must stay clean. Every row names the knowledge it exercises so the
# coverage matrix attributes it. The loader concatenates every cases.yaml under
# benchmarks/diff, so a language file joins the library without any wiring.
cases:
  - name: path-traversal-go
    category: path-traversal
    knowledge:
      vulnerabilities: [path-traversal]
    tags: [injection, go]
    diff: |
      diff --git a/handler.go b/handler.go
      --- a/handler.go
      +++ b/handler.go
      @@ -10,2 +10,3 @@ func download(w http.ResponseWriter, r *http.Request) {
      -    return
      +    f, _ := os.Open(r.URL.Query().Get("file"))
      +    io.Copy(w, f)

  - name: safe-path-traversal-go
    knowledge:
      vulnerabilities: [path-traversal]
    tags: [injection, go, safe]
    diff: |
      diff --git a/handler.go b/handler.go
      --- a/handler.go
      +++ b/handler.go
      @@ -10,2 +10,4 @@ func download(w http.ResponseWriter, r *http.Request) {
      -    return
      +    name := filepath.Base(r.URL.Query().Get("file"))
      +    f, _ := os.Open(filepath.Join("/srv/public", name))
      +    io.Copy(w, f)

  - name: gin-sqli
    category: sql-injection
    knowledge:
      vulnerabilities: [sql-injection]
      guides: [frameworks/go/gin]
    tags: [injection, go, gin]
    diff: |
      diff --git a/handlers/users.go b/handlers/users.go
      --- a/handlers/users.go
      +++ b/handlers/users.go
      @@ -12,2 +12,4 @@ func GetUser(c *gin.Context) {
      -    c.JSON(200, nil)
      +    name := c.Query("name")
      +    q := fmt.Sprintf("SELECT * FROM users WHERE name = '%s'", name)
      +    rows, _ := db.Query(q)
      +    c.JSON(200, scan(rows))

  - name: gin-cmdi
    category: command-injection
    knowledge:
      vulnerabilities: [command-injection]
      guides: [frameworks/go/gin]
    tags: [injection, go, gin]
    diff: |
      diff --git a/handlers/ops.go b/handlers/ops.go
      --- a/handlers/ops.go
      +++ b/handlers/ops.go
      @@ -8,2 +8,4 @@ func Ping(c *gin.Context) {
      -    c.Status(204)
      +    host := c.Query("host")
      +    out, _ := exec.Command("sh", "-c", "ping -c 1 "+host).Output()
      +    c.String(200, string(out))

  - name: gin-path-traversal
    category: path-traversal
    knowledge:
      vulnerabilities: [path-traversal]
      guides: [frameworks/go/gin]
    tags: [injection, go, gin]
    diff: |
