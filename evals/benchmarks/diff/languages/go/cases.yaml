      --- a/handlers/files.go
      +++ b/handlers/files.go
      @@ -9,2 +9,3 @@ func Download(c *gin.Context) {
      -    c.Status(404)
      +    name := c.Query("file")
      +    c.File(filepath.Join("/srv/files", name))

  - name: gin-idor
    category: insecure-direct-object-reference
    knowledge:
      vulnerabilities: [insecure-direct-object-reference]
      guides: [frameworks/go/gin]
    tags: [authz, go, gin]
    diff: |
      diff --git a/handlers/orders.go b/handlers/orders.go
      --- a/handlers/orders.go
      +++ b/handlers/orders.go
      @@ -11,2 +11,4 @@ func GetOrder(c *gin.Context) {
      -    c.Status(404)
      +    var o Order
      +    db.First(&o, c.Param("id"))
      +    c.JSON(200, o)

  - name: gin-missing-auth
    category: missing-authorization
    knowledge:
      vulnerabilities: [missing-authorization]
      guides: [frameworks/go/gin]
    tags: [authz, go, gin]
    diff: |
      diff --git a/routes/routes.go b/routes/routes.go
      --- a/routes/routes.go
      +++ b/routes/routes.go
      @@ -14,3 +14,4 @@ func Register(r *gin.Engine) {
           admin := r.Group("/admin", middleware.AuthRequired(), middleware.AdminOnly())
           admin.GET("/users", handlers.ListUsers)
      +    r.DELETE("/admin/users/:id", handlers.DeleteUser)

  - name: gin-mass-assignment
    category: mass-assignment
    knowledge:
      vulnerabilities: [mass-assignment]
