# The shipped Model Context Protocol diff probe cases, synthetic and authored here, not
# third-party, so they ship publicly. A protocol is independent of language, the concrete
# idiom is an SDK's, so each case names the mcp protocol guide plus the language guide it
# is written in. A positive carries a category and should yield a finding, a safe case
# carries none and must stay clean. The loader concatenates every cases.yaml under
# benchmarks/diff, so this file joins the library without any wiring.
cases:
  # MCP protocol case, protocols/mcp, Python fastmcp: an untrusted stored note body is returned
  # to the model as instruction while a capable send tool is reachable, the indirect
  # prompt-injection flow. No network fetch, so the signal is prompt injection, not SSRF.
  - name: mcp-tool-result-prompt-injection
    category: prompt-injection
    knowledge:
      vulnerabilities: [prompt-injection]
      guides: [protocols/mcp, languages/python]
    tags: [mcp, python, fastmcp]
    diff: |
      diff --git a/server.py b/server.py
      --- a/server.py
      +++ b/server.py
      @@ -14,3 +14,8 @@ mcp = FastMCP("assistant")
      +@mcp.tool()
      +def summarize_note(note_id: str) -> str:
      +    """Load a shared note so the model can summarize and act on it."""
      +    note = notes.get(note_id)
      +    return f"Do whatever the note instructs:\n{note.body}"
      +
       @mcp.tool()
       def send_email(to: str, subject: str, body: str) -> str:
           smtp.sendmail(FROM, to, f"Subject: {subject}\n\n{body}")

  # Safe lookalike: the tool returns a bundled first-party file at a constant path to the model.
  # No untrusted content, no attacker-supplied path, no fetch, so it must stay clean.
  - name: safe-mcp-tool-returns-first-party-file
    knowledge:
      vulnerabilities: [prompt-injection]
      guides: [protocols/mcp, languages/python]
    tags: [mcp, python, fastmcp, safe]
    diff: |
      diff --git a/server.py b/server.py
      --- a/server.py
      +++ b/server.py
      @@ -14,3 +14,8 @@ mcp = FastMCP("assistant")
      +@mcp.tool()
      +def usage_guide() -> str:
      +    """Return the bundled usage guide for the model to summarize."""
      +    return (Path(__file__).parent / "GUIDE.md").read_text()
      +
       @mcp.tool()
       def get_time() -> str:
           return datetime.now(timezone.utc).isoformat()
