# A real-world repository target, not vendored. The review runs against a clone, so this stores only the
# pointer plus the stack and knowledge this benchmark exercises. git-mcp-server is a Model Context
# Protocol server that exposes git operations as MCP tools, this is its real code at a real
# vulnerable release, not authored here. Real third-party code is never copied in, this repository ships
# to GitHub and PyPI.
id: git-mcp-server
kind: repository

target:
  type: git
  url: https://github.com/cyanheads/git-mcp-server
  # tag v2.1.4, the last vulnerable release, the fix ships in v2.1.5
  ref: f30169ec3a2520990e5467c19ef42ea7d6d9270e
  # review scope: the MCP tool handlers, where every git tool builds a shell string from its
  # arguments and runs it through child_process.exec
  path: src/mcp-server/tools

stack:
  languages:
    - typescript
  frameworks: []
  protocols:
    - mcp

knowledge:
  vulnerabilities:
    - command-injection
  guides:
    - languages/typescript
    - protocols/mcp

tags:
  - public
  - web
  - typescript
  - mcp
  - command-injection
