# Answer key for the fosite redirect matching target. Real third-party code at a real vulnerable
# release, not authored here, see benchmark.yaml for the clone pointer. The review under test never
# reads this file.
#
# Checked out at tag v0.34.0, the release before the v0.34.1 fix, review scope the whole repository.
# Confirmed by reading authorize_helper.go at this commit. Public advisory GHSA-5hvv-m4w4-gf6v, so
# this target measures regression more than true recall. Per the answer-key convention, the one
# disclosed weakness is one planted entry.

target: fosite

planted:
  - id: redirect-uri-case-insensitive-match
    category: open-redirect
    file: authorize_helper.go
    severity: HIGH
    symbols:
      - isMatchingRedirectURI
      - MatchRedirectURIWithClientRedirectURIs
    note: >-
      GHSA-5hvv-m4w4-gf6v. isMatchingRedirectURI compares each registered redirect URI to the
      requested one with strings.ToLower(b) == strings.ToLower(uri), a case-insensitive match rather
      than the exact string match the OAuth 2.0 redirect_uri check requires. A client registered
      with https://example.com/callback then accepts a request for https://example.com/CALLBACK, so
      an attacker who can influence the path case, or an origin with a case-sensitive open redirect
      or user-controlled content, can steer the authorization response and leak the authorization
      code. The same helper also honors a loopback override that lets a requested loopback redirect
      override the registered host and query, a second redirect_uri validation break. Both are the
      redirect_uri exact match invariant in the oauth guide, and both are fixed in v0.34.1 by moving
      to an exact comparison. A review that surfaces the redirect_uri matching that is not exact in
      authorize_helper.go hits this entry.
    knowledge:
      vulnerabilities:
        - open-redirect
      guides:
        - languages/go
        - protocols/oauth
