# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Omni is Sidero Labs' real
# open-source Kubernetes management platform, this is its real code at a real vulnerable commit,
# not authored here. Real third-party code is never copied in, this repository ships to GitHub and PyPI.
id: omni
kind: repository

target:
  type: git
  url: https://github.com/siderolabs/omni
  # the vulnerable commit, the parent of fix 272d3f4 which consumes a SAML session once
  ref: a199343b6bb154d3cbf4379e5dfc6b942001513e
  # review scope: the auth interceptor, where the SAML session is validated
  path: internal/pkg/auth/interceptor

stack:
  languages:
    - go
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - replay-attack
  guides:
    - languages/go

tags:
  - public
  - web
  - go
  - replay-attack
