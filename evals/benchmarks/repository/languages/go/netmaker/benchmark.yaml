# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Netmaker is a real, widely
# used open-source WireGuard mesh-VPN platform, this is its real code at a real vulnerable commit,
# not authored here. Real third-party code is never copied in, this repository ships to GitHub and PyPI.
# It is grouped under languages, the HTTP layer uses gorilla/mux on the Go standard library, not a
# framework we carry a guide for.
id: netmaker
kind: repository

target:
  type: git
  url: https://github.com/gravitl/netmaker
  # the vulnerable commit, the parent of fix d82e3a9 which rejects a non-admin setting isadmin
  ref: 9f5e9c1ef54b8acf514362c966614b0812e15b9b
  # review scope: the HTTP controllers, where the user routes bind the request body
  path: controllers

stack:
  languages:
    - go
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - mass-assignment
  guides:
    - languages/go

tags:
  - public
  - web
  - go
  - mass-assignment
