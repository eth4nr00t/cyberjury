target: trident-concentrated

# Ground truth is the Code4rena SushiSwap Trident phase 2 report,
# https://code4rena.com/reports/2021-09-sushitrident-2, cross checked against the
# audited source at commit c405f340 in sushiswap/trident. The review under test
# never reads this file. Per answer-key convention, one disclosed weakness is one
# planted entry, so the single high severity unchecked overflow finding is kept as
# one entry anchored to its function.
planted:
  - id: mint-unchecked-reserve-overflow
    category: unsafe-math
    file: contracts/pool/concentrated/ConcentratedLiquidityPool.sol
    severity: HIGH
    symbols:
      - mint
    note: >-
      C4 H-04. mint runs the reserve balance check and update inside an unchecked
      block, so amount0Actual + reserve0 and amount1Actual + reserve1 wrap on
      overflow instead of reverting. A caller can size a mint so the sum wraps
      below the balance, passing the TOKEN0_MISSING and TOKEN1_MISSING require
      checks without supplying the tokens, so reserve accounting credits liquidity
      that was never funded. The safe pattern drops unchecked so the checked
      addition reverts on overflow.
    knowledge:
      vulnerabilities:
        - unsafe-math
      guides:
        - languages/solidity
