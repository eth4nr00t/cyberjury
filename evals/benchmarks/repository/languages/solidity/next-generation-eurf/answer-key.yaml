target: next-generation-eurf

# Ground truth from the Code4rena report at https://code4rena.com/reports/2025-01-next-generation
# cross checked against the audited source at commit 499cfa50. The report has one High and
# three Medium. H-01 and M-03 are the same signature class in the same file, so they collapse
# to one planted entry. Token.sol holds two distinct medium entries, so each carries
# `symbols`, the functions on its true path, so a report of the same class on a sibling
# function in the file no longer credits it.

planted:
  - id: forwarder-signature-replay
    category: signature-replay
    file: contracts/Forwarder.sol
    severity: HIGH
    note: >-
      C4 H-01 plus M-03. domainSeparator is a caller supplied parameter to verify and
      execute, so a signed ForwardRequest is valid on any chain, and ForwardRequest has no
      deadline field, so a signature never expires until its nonce is consumed.
    knowledge:
      vulnerabilities:
        - signature-replay
      guides:
        - languages/solidity

  - id: fee-charged-beyond-allowance
    category: accounting-precision
    file: contracts/Token.sol
    severity: MEDIUM
    symbols:
      - transferFrom
      - allowance
    note: >-
      C4 M-01. transferFrom charges the transfer fee through an internal _update on top of
      amount, but the ERC-20 allowance only covers amount, so a spender moves more of the
      holder's balance than was approved. Closest of the eight EVM classes is accounting,
      the bug is really an allowance accounting gap.
    knowledge:
      vulnerabilities:
        - accounting-precision
      guides:
        - languages/solidity

  - id: approve-skips-blacklist
    category: access-control
    files:
      - contracts/Token.sol
      - contracts/ERC20AdminUpgradeable.sol
    severity: MEDIUM
    symbols:
      - approve
      - transferSanity
      - adminSanity
    note: >-
      C4 M-02. transfer and transferFrom call transferSanity, which runs the blacklist check,
      but approve is never overridden to do the same, so a blacklisted account can still be
      granted an allowance, breaking the blacklist invariant. The same defect is correctly
      reported at the blacklist logic in ERC20AdminUpgradeable.sol as well as at Token.sol,
      so both files are accepted anchors.
    knowledge:
      vulnerabilities:
        - access-control
      guides:
        - languages/solidity

safe:
  - id: forwarder-checked-low-level-call
    category: unchecked-low-level-call
    file: contracts/Forwarder.sol
    note: >-
      execute makes a low level call then checks the result with
      require(success, "NGEUR Forwarder: failed tx execution"), so the return value is not
      ignored. A report of an unchecked call here is a false positive.
    knowledge:
      vulnerabilities:
        - unchecked-low-level-call
      guides:
        - languages/solidity

  - id: gated-uups-upgrade
    category: proxy-delegatecall
    file: contracts/Token.sol
    note: >-
      The contract is UUPS upgradeable and _authorizeUpgrade is gated onlyRole(OWNER), so the
      upgrade path is access controlled. A report of an unprotected upgrade or delegatecall
      here is a false positive.
    knowledge:
      vulnerabilities:
        - proxy-delegatecall
      guides:
        - languages/solidity
