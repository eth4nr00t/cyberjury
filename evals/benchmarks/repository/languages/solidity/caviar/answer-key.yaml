# Answer key for the Caviar real-repository target. Real third-party code at the audited commit, not
# authored here, see benchmark.yaml for the clone pointer. The review under test never reads
# this file.
#
# Checked out at 0212f9d, the Code4rena 2022-12 contest snapshot, review scope src. Confirmed by
# reading Pair.sol at this commit. Public report H-01, so this target measures regression more
# than true recall. It plants one weird-ERC-20 assumption flaw, the AMM trusts a plain ERC-20
# transfer and breaks when the configured base token is an ERC-777 whose transfer hook hands
# control to the attacker. No reentrancy guard exists on the pair, so the callback re-enters
# against stale reserves.

target: caviar

planted:
  - id: pair-erc777-callback-stale-reserves
    category: weird-erc20
    file: src/Pair.sol
    severity: HIGH
    symbols:
      - buy
    note: >-
      C4 H-01. Pair.buy credits the caller fractional tokens with _transferFrom before it pulls
      the base token in with ERC20(baseToken).safeTransferFrom, and the pair carries no
      nonReentrant guard. When baseToken is an ERC-777, its tokensToSend hook hands control to the
      attacker mid transfer, who re-enters buy against stale reserves and buys fractions below
      price. The root cause is the contract assuming a vanilla ERC-20, the weird-ERC-20 callback
      class. The same plain-transfer assumption spans sell, add, and remove.
    knowledge:
      vulnerabilities:
        - weird-erc20
      guides:
        - languages/solidity
        - protocols/erc-standards
