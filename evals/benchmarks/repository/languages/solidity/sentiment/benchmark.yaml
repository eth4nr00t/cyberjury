# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Sentiment is a real DeFi
# lending protocol, this is its real audited code at the Sherlock contest snapshot, not authored
# here. Real third-party code is never copied in, this repository ships to GitHub and PyPI.
id: sentiment
kind: repository

target:
  type: git
  url: https://github.com/sherlock-audit/2022-12-sentiment
  # the audited Sherlock 2022-12 contest snapshot, later commits touch only README and contest meta
  ref: 740b41ed4a122a122574c82c755da6819cae39ee
  # review scope: the oracle package, where LP token prices are read
  path: oracle/src

stack:
  languages:
    - solidity
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - reentrancy
  guides:
    - languages/solidity
    - protocols/defi-primitives

tags:
  - public
  - evm
  - solidity
  - sherlock
  - read-only-reentrancy
  - reentrancy
