# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Parse Server is a real,
# widely deployed open-source backend, this is its real code at a real vulnerable commit, not
# authored here. Real third-party code is never copied in, this repository ships to GitHub and PyPI.
id: parse-server
kind: repository

target:
  type: git
  url: https://github.com/parse-community/parse-server
  # the vulnerable commit, the parent of fix 93425df which type-checks the auth id
  ref: 5990ad9245c4aae80489f234a1c3cf6ab4abc92e
  # review scope: the server source, where the auth-data lookup builds the Mongo query
  path: src

stack:
  languages:
    - javascript
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - nosql-injection
  guides:
    - languages/javascript

tags:
  - public
  - web
  - javascript
  - nosql-injection
