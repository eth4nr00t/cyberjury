# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. MLflow is the dominant
# open-source machine-learning lifecycle platform, this is its real code at a real vulnerable
# commit, not authored here. Real third-party code is never copied in, this repository ships to GitHub
# and PyPI. It is grouped under languages, the dataset source module is plain Python, not a web
# framework we carry a guide for.
id: mlflow
kind: repository

target:
  type: git
  url: https://github.com/mlflow/mlflow
  # the vulnerable commit, the parent of fix 400c226 which sanitizes the Content-Disposition filename
  ref: d10f342899f2677a57e92e6380ea2ba883c3adf3
  # review scope: the data package, where a remote dataset is fetched and written to disk
  path: mlflow/data

stack:
  languages:
    - python
  frameworks: []
  protocols: []

knowledge:
  vulnerabilities:
    - path-traversal
  guides:
    - languages/python

tags:
  - public
  - web
  - python
  - path-traversal
