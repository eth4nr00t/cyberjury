# Answer key for the aiohttp response-splitting target. Real third-party code at a real vulnerable
# commit, not authored here, see benchmark.yaml for the clone pointer. The review under test never
# reads this file.
#
# Checked out at db560cf, the parent of the fix 53b35a2, review scope aiohttp. Confirmed by reading
# aiohttp/web_response.py and aiohttp/http_writer.py at this commit. Public advisory
# GHSA-mwh4-6h8g-pg8w, so this target measures regression more than true recall. It plants one HTTP
# response-splitting flaw, a reason phrase that admits a carriage return into the status line.

target: aiohttp

planted:
  - id: response-reason-cr-splitting
    category: http-response-splitting
    file: aiohttp/web_response.py
    severity: MEDIUM
    symbols:
      - _set_status
      - set_status
    note: >-
      GHSA-mwh4-6h8g-pg8w. StreamResponse._set_status validates the reason phrase with elif "\n" in
      reason, rejecting a line feed but not a carriage return, and the reason is then interpolated
      into the status line as f"HTTP/{v} {self._status} {self._reason}". The header serializer
      _py_serialize_headers in http_writer.py escapes header names and values but never validates
      the status line, so a reason carrying a bare \r splits the response and injects headers or a
      second response body. An app that builds web.Response(reason=user_input) is exploitable. The
      fix rejects \r as well as \n and runs the status line through _safe_header.
    knowledge:
      vulnerabilities:
        - http-response-splitting
      guides:
        - languages/python

safe:
  - id: header-serializer-rejects-crlf
    category: http-response-splitting
    file: aiohttp/http_writer.py
    symbols:
      - _safe_header
    note: >-
      _safe_header runs over every header name and value in _py_serialize_headers and raises
      ValueError when a carriage return, line feed, or null byte is present, so an attacker cannot
      split the response through a header value. It is the header-writing path that a splitting
      review naturally inspects, but it is correctly guarded, so a response-splitting report on the
      header path is a false positive. The real gap is the status-line reason, which this function
      does not cover at this commit.
    knowledge:
      vulnerabilities:
        - http-response-splitting
      guides:
        - languages/python
