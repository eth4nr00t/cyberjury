# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Fides is a widely used open
# source privacy engineering platform with a FastAPI webserver, this is its real code at a real
# vulnerable commit, not authored here. Real third-party code is never copied in, this repository ships
# to GitHub and PyPI.
id: fides
kind: repository

target:
  type: git
  url: https://github.com/ethyca/fides
  # tag 2.43.0, in the vulnerable range >= 2.19.0 and < 2.44.0, the SSTI fix ships in 2.44.0
  ref: 2445fefca0f6bc4cf763ec0c60d1c4546789ba48
  # review scope: the api package, which owns the messaging-template route and the dispatch service
  path: src/fides/api

stack:
  languages:
    - python
  frameworks:
    - fastapi
  protocols: []

knowledge:
  vulnerabilities:
    - server-side-template-injection
  guides:
    - languages/python
    - frameworks/python/fastapi

tags:
  - public
  - web
  - python
  - fastapi
  - server-side-template-injection
