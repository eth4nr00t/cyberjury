# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. manga-image-translator is a
# real, popular open-source self-hosted tool with a FastAPI share server, this is its real code
# at a real vulnerable commit, not authored here. Real third-party code is never copied in, this
# repository ships to GitHub and PyPI.
id: manga-image-translator
kind: repository

target:
  type: git
  url: https://github.com/zyddnys/manga-image-translator
  # the vulnerable commit, the parent of fix 10a5566 which removed the pickle path
  ref: c022b927967eb09c31d0fb65fee14106d85a0d4e
  # review scope: the share-server mode module, where the FastAPI routes deserialize the body
  path: manga_translator/mode

stack:
  languages:
    - python
  frameworks:
    - fastapi
  protocols: []

knowledge:
  vulnerabilities:
    - insecure-deserialization
  guides:
    - languages/python
    - frameworks/python/fastapi

tags:
  - public
  - web
  - python
  - fastapi
  - insecure-deserialization
