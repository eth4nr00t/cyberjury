# A real-world repository target, not vendored. The review runs against a clone, so this stores only
# the pointer plus the stack and knowledge this benchmark exercises. Glances is a real, popular
# open-source system monitor whose web mode serves a FastAPI REST API, this is its real code at a
# real vulnerable commit, not authored here. Real third-party code is never copied in, this repository
# ships to GitHub and PyPI.
id: glances
kind: repository

target:
  type: git
  url: https://github.com/nicolargo/glances
  # the vulnerable commit, the parent of fix 16f6caf which redacts secrets from the args endpoint
  ref: 5850c564ee10804fdf884823b9c210eb954dd1f9
  # review scope: the outputs package, where the FastAPI REST server defines its routes
  path: glances/outputs

stack:
  languages:
    - python
  frameworks:
    - fastapi
  protocols: []

knowledge:
  vulnerabilities:
    - information-exposure
  guides:
    - languages/python
    - frameworks/python/fastapi

tags:
  - public
  - web
  - python
  - fastapi
  - information-exposure
