# A real-world repository target, not vendored. The review runs against a clone, so this stores
# only the pointer plus the stack and knowledge this benchmark exercises, the coverage
# matrix reads them. Real third-party code is never copied in, this repository ships to GitHub
# and PyPI. Open WebUI is a real self-hosted LLM chat UI, this target covers the
# access-control surface of its FastAPI backend routers.
id: open-webui
kind: repository

target:
  type: git
  url: https://github.com/open-webui/open-webui
  ref: v0.3.8   # a release before the memory-router IDOR fix
  # review scope: the access-control surface, 11 routers
  path: backend/apps/webui

stack:
  languages:
    - python
  frameworks:
    - fastapi
  protocols: []

knowledge:
  vulnerabilities:
    - insecure-direct-object-reference
  guides:
    - languages/python
    - frameworks/python/fastapi

tags:
  - public
  - web
  - python
  - fastapi
  - insecure-direct-object-reference
