# A real-world repository target, not vendored. The review runs against a clone, so this stores
# only the pointer plus the stack and knowledge this benchmark exercises. Paperless-ngx is a
# real, widely deployed Django and DRF document management system, this is its real code at a
# real vulnerable version, not authored here. Real third-party code is never copied in, this
# repository ships to GitHub and PyPI.
id: paperless-ngx
kind: repository

target:
  type: git
  url: https://github.com/paperless-ngx/paperless-ngx
  # v2.20.1 is the last release before the 2.20.2 ReDoS fix, and it still carries the two
  # access-control flaws, which are fixed later, the storage path test in 2.20.7 and the global
  # search mail leak in 2.20.12. So this one pin carries all three.
  ref: v2.20.1
  # review scope: the documents app, which owns the views, serializers, permissions, the
  # filename templating, and the matching engine that the planted flaws span
  path: src/documents

stack:
  languages:
    - python
  frameworks:
    - django
  protocols: []

knowledge:
  vulnerabilities:
    - insecure-direct-object-reference
    - missing-authorization
    - server-side-template-injection
    - resource-exhaustion
  guides:
    - languages/python
    - frameworks/python/django

tags:
  - public
  - web
  - python
  - django
  - insecure-direct-object-reference
  - missing-authorization
  - server-side-template-injection
  - resource-exhaustion
