# Answer key for the CKAN CSRF target. Real third-party code at a real vulnerable commit, not
# authored here, see benchmark.yaml for the clone pointer. The review under test never reads this
# file.
#
# Checked out at afa5e98, the parent of the bfb4100 fix, review scope ckan/config/middleware.
# Confirmed by reading flask_app.py at this commit. Public advisory CVE-2026-41255,
# GHSA-mcvf-jxcw-vj73, so this target measures regression more than true recall. It plants one
# CSRF flaw, an exemption that mutates process-wide state, so the fix making it per-request is the
# correct version.

target: ckan

planted:
  - id: csrf-exempt-process-wide
    category: cross-site-request-forgery
    file: ckan/config/middleware/flask_app.py
    severity: MEDIUM
    symbols:
      - ckan_before_request
    note: >-
      CVE-2026-41255. ckan_before_request, when a request authenticates via the Authorization
      header (g.login_via_auth_header), resolves the matched view and calls csrf.exempt(dest) on
      the module-level CSRFProtect instance. exempt mutates a process-lifetime set, not per-request
      state, so once any token request hits a state-changing view that view stays CSRF-exempt for
      the whole worker, and a later cookie-authenticated victim can be CSRF'd on that POST or PUT
      with no token. The fix exempts per request through g instead of the shared instance.
    knowledge:
      vulnerabilities:
        - cross-site-request-forgery
      guides:
        - languages/python
        - frameworks/python/flask
