schema_version: 1

target: answer

planted:
  - id: accept-answer-no-owner-check
    category: missing-authorization
    entry: POST /answer/acceptance
    files:
      - internal/service/answer_service.go
    severity: HIGH
    note: The POST /answer/acceptance handler checks only the caller's rank before calling
          UpdateAccepted. In the introduced diff, internal/service/answer_service.go comments
          out the existing questionInfo.UserID != req.UserID guard. A caller who meets the rank
          threshold can therefore accept an answer for a question they do not own, and the
          acceptance path awards the normal acceptance activity and reputation. The vulnerable
          change is commit d3d049a9, whose parent is the guarded implementation.
    knowledge:
      vulnerabilities:
        - missing-authorization
      guides:
        - languages/go
        - frameworks/go/gin

safe:
  - id: safe-answer-edit-delete-owner-gated
    category: missing-authorization
    entry: PUT /answer
    files:
      - internal/service/permission/answer_permission.go
    note: GetAnswerPermission grants edit and delete when userID equals creatorUserID, and the
          controller computes objectOwner via rankService.CheckOperationObjectOwner, so answer
          edit and delete are correctly scoped to the answer's owner. It is the direct contrast
          to the unchecked accept, reporting answer edit or delete as missing authorization is
          a false positive.
    knowledge:
      vulnerabilities:
        - missing-authorization
      guides:
        - languages/go
        - frameworks/go/gin
