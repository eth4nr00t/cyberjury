schema_version: 1

target: manga-image-translator

planted:
  - id: share-execute-pickle-body
    category: insecure-deserialization
    entry: POST /execute/{method_name}
    files:
      - manga_translator/mode/share.py
    severity: CRITICAL
    symbols:
      - execute_method
    note: >-
      CVE-2026-26215. The FastAPI share server defines @app.post("/execute/{method_name}") and
      @app.post("/simple_execute/{method_name}") whose handler does
      attr = pickle.loads(await request.body()) on the raw HTTP body. The only gate, check_nonce,
      enforces nothing when the nonce is unset, which is the default, so an unauthenticated client
      gets remote code execution by posting a crafted pickle. The fix removes the pickle path.
    knowledge:
      vulnerabilities:
        - insecure-deserialization
      guides:
        - languages/python
        - frameworks/python/fastapi

safe:
  - id: safe-is-locked-route
    category: insecure-deserialization
    entry: GET /is_locked
    files:
      - manga_translator/mode/share.py
    symbols:
      - listen
    note: >-
      The @app.get("/is_locked") route in the same file does no deserialization, it returns a
      status only. It is the benign sibling of the execute routes, a report of insecure
      deserialization here is a false positive.
    knowledge:
      vulnerabilities:
        - insecure-deserialization
      guides:
        - languages/python
        - frameworks/python/fastapi
