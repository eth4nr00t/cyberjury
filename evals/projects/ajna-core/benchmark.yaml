        root_cause: The new ERC721Pool.mergeOrRemoveCollateral (src/erc721/ERC721Pool.sol:143) transfers bucket NFTs to the caller (src/erc721/ERC721Pool.sol:168) without the Auctions.revertIfAuctionClearable check that ERC721Pool.removeCollateral applies (src/erc721/ERC721Pool.sol:177), so collateral leaves buckets before a clearable auction settles its bad debt against them
