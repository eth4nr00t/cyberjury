          - {file: src/libraries/external/Auctions.sol, line: 370, side: new}
      - id: kick-with-deposit-lup-pricing-error
        root_cause: The new Auctions.kickWithDeposit compares the kicker's bucket price (src/libraries/external/Auctions.sol:361) with a LUP computed with the kicker's deposit added to pool debt (src/libraries/external/Auctions.sol:700, src/libraries/external/Auctions.sol:354), so a deposit below the real LUP kicks a loan that was not undercollateralized
        locations:
          - {file: src/libraries/external/Auctions.sol, line: 354}
