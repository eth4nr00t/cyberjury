    checks:
      - id: kick-with-deposit-debt-lock-accounting-error
        root_cause: The new Pool.kickWithDeposit (src/base/Pool.sol:306, src/base/Pool.sol:312) removes the caller's deposit as the kick bond without the _revertIfAuctionDebtLocked check that moveQuoteToken and removeQuoteToken apply (src/base/Pool.sol:124, src/base/Pool.sol:155), so deposit locked behind auction debt leaves the pool and the bad debt falls on the remaining lenders
        locations:
          - {file: src/base/Pool.sol, line: 306}
          - {file: src/base/Pool.sol, line: 312}
        change_anchors:
          - {file: src/base/Pool.sol, line: 306, side: new}
          - {file: src/base/Pool.sol, line: 312, side: new}
      - id: kick-with-deposit-htp-accounting-error
        root_cause: The new Auctions.kickWithDeposit removes the kicker's deposit (src/libraries/external/Auctions.sol:367, src/libraries/external/Auctions.sol:370) without the LUP below HTP revert that removeQuoteToken performs (src/libraries/external/LenderActions.sol:282), so deposit that collateralizes outstanding loans leaves the bucket as the kicker's bond
        locations:
          - {file: src/libraries/external/Auctions.sol, line: 367}
          - {file: src/libraries/external/Auctions.sol, line: 370}
        change_anchors:
