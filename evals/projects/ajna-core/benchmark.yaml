cases:
  - id: repository-463dcd3
    kind: repository
    checks:
      - id: auction-clearable-head-accounting-error
        root_cause: RevertsHelper._revertIfAuctionClearable inspects only auctions_.head (src/libraries/helpers/RevertsHelper.sol:51, src/libraries/helpers/RevertsHelper.sol:57) while Auctions.settlePoolDebt lets any queued auction whose collateral was fully taken settle immediately (src/libraries/external/Auctions.sol:215), so while the older head auction is not yet clearable ERC20Pool.removeCollateral and ERC721Pool.removeCollateral (src/ERC20Pool.sol:322, src/ERC721Pool.sol:322), which have no debt lock, let LP holders redeem bucket collateral at the pre-forgiveness exchange rate before settlement forgives that bucket's deposit and leaves the loss to the remaining LP holders
        locations:
          - {file: src/ERC20Pool.sol, line: 322}
          - {file: src/ERC721Pool.sol, line: 322}
          - {file: src/libraries/external/Auctions.sol, line: 215}
          - {file: src/libraries/helpers/RevertsHelper.sol, line: 51}
          - {file: src/libraries/helpers/RevertsHelper.sol, line: 57}
      - id: auction-loan-heap-denial-of-service
        root_cause: BorrowerActions.drawDebt and BorrowerActions.repayDebt read the borrower's auction state only when collateral is pledged or debt is repaid (src/libraries/external/BorrowerActions.sol:129, src/libraries/external/BorrowerActions.sol:281) and otherwise call Loans.update with inAuction false (src/libraries/external/BorrowerActions.sol:208, src/libraries/external/BorrowerActions.sol:347), so a zero-amount call for any borrower reinserts an auctioned loan into the loan heap (src/libraries/internal/Loans.sol:102) whose threshold price then fails the HTP check in removeQuoteToken (src/libraries/external/LenderActions.sol:352) and the max loan selection in kickWithDeposit (src/libraries/external/Auctions.sol:422)
        locations:
          - {file: src/libraries/external/BorrowerActions.sol, line: 129}
          - {file: src/libraries/external/BorrowerActions.sol, line: 208}
          - {file: src/libraries/external/BorrowerActions.sol, line: 281}
          - {file: src/libraries/external/BorrowerActions.sol, line: 347}
      - id: claimable-bond-reserves-accounting-error
        root_cause: Auctions._removeAuction moves a settled auction's bond into the kicker's claimable balance and subtracts it from auctions_.totalBondEscrowed (src/libraries/external/Auctions.sol:1247, src/libraries/external/Auctions.sol:1253) while the bond stays in the pool's quote balance until withdrawBonds (src/base/Pool.sol:323), so _claimableReserves (src/libraries/helpers/PoolHelper.sol:270, src/libraries/helpers/PoolHelper.sol:272) counts unwithdrawn kicker bonds as reserves that anyone can put up for a reserve auction and buy with AJNA (src/base/Pool.sol:343, src/base/Pool.sol:372), leaving kickers' bond withdrawals to be paid from lender deposits
        locations:
          - {file: src/base/Pool.sol, line: 323}
          - {file: src/libraries/external/Auctions.sol, line: 1247}
          - {file: src/libraries/external/Auctions.sol, line: 1253}
          - {file: src/libraries/helpers/PoolHelper.sol, line: 272}
      - id: cryptopunks-deposit-front-running
        root_cause: ERC721Pool._transferFromSenderToPool acquires a CryptoPunk with buyPunk(tokenId) (src/ERC721Pool.sol:577) without checking that msg.sender owns it, so the punk an owner offered to the pool is credited to whichever caller pledges or adds it first
        locations:
          - {file: src/ERC721Pool.sol, line: 577}
      - id: interest-rate-collateral-accounting-error
        root_cause: PoolCommons.updateInterestRate measures target utilization against an EMA of LUP times pledged collateral capped only at ten times the pool debt (src/libraries/external/PoolCommons.sol:81, src/libraries/external/PoolCommons.sol:88, src/libraries/external/PoolCommons.sol:101), so collateral pledged far beyond a borrower's debt lowers target utilization and raises the rate every borrower pays
        locations:
          - {file: src/libraries/external/PoolCommons.sol, line: 81}
          - {file: src/libraries/external/PoolCommons.sol, line: 88}
          - {file: src/libraries/external/PoolCommons.sol, line: 101}
      - id: kick-with-deposit-debt-lock-accounting-error
        root_cause: Pool.kickWithDeposit (src/base/Pool.sol:291) removes the caller's deposit as the kick bond without the _revertIfAuctionDebtLocked check that moveQuoteToken and removeQuoteToken apply (src/base/Pool.sol:180, src/base/Pool.sol:212), so deposit locked behind auction debt leaves the pool and the bad debt falls on the remaining lenders
        locations:
          - {file: src/base/Pool.sol, line: 291}
      - id: kick-with-deposit-htp-accounting-error
        root_cause: Auctions.kickWithDeposit removes the kicker's deposit (src/libraries/external/Auctions.sol:440) without the LUP below HTP revert that removeQuoteToken performs (src/libraries/external/LenderActions.sol:352), so deposit that collateralizes outstanding loans leaves the bucket as the kicker's bond
        locations:
          - {file: src/libraries/external/Auctions.sol, line: 440}
      - id: kick-with-deposit-lup-pricing-error
        root_cause: Auctions.kickWithDeposit compares the kicker's bucket price (src/libraries/external/Auctions.sol:437) with a LUP computed with the kicker's deposit added to pool debt (src/libraries/external/Auctions.sol:787, src/libraries/external/Auctions.sol:430), so a deposit below the real LUP kicks a loan that was not undercollateralized
        locations:
          - {file: src/libraries/external/Auctions.sol, line: 430}
          - {file: src/libraries/external/Auctions.sol, line: 437}
          - {file: src/libraries/external/Auctions.sol, line: 787}
      - id: lp-transfer-denial-of-service
        root_cause: LenderActions.transferLPs reverts unless the approved amount equals the owner's entire LP balance (src/libraries/external/LenderActions.sol:538), so any change to that balance, including PositionManager holding several positions in one bucket, blocks the transfer that PositionManager.reedemPositions performs (src/PositionManager.sol:303, src/PositionManager.sol:311)
        locations:
          - {file: src/PositionManager.sol, line: 303}
          - {file: src/PositionManager.sol, line: 311}
          - {file: src/libraries/external/LenderActions.sol, line: 538}
      - id: lp-transfer-missing-permission
        root_cause: Pool.transferLPs accepts any caller (src/base/Pool.sol:238), so a third party executes an owner's LP approval to PositionManager outside memorializePositions and the LPs reach PositionManager without being credited to any position
        locations:
          - {file: src/base/Pool.sol, line: 238}
      - id: merge-remove-collateral-accounting-error
        root_cause: ERC721Pool.mergeOrRemoveCollateral (src/ERC721Pool.sol:280) omits the _revertIfAuctionClearable check that removeCollateral applies (src/ERC721Pool.sol:322), so collateral leaves buckets before a clearable auction settles its bad debt against them
        locations:
          - {file: src/ERC721Pool.sol, line: 280}
      - id: move-quote-deposit-time-accounting-error
        root_cause: LenderActions.moveQuoteToken sets the destination lender's depositTime to the later of the source depositTime and the destination bankruptcy time (src/libraries/external/LenderActions.sol:278) without considering the destination's existing depositTime, while LenderActions.removeQuoteToken charges the early withdrawal fee from that depositTime alone (src/libraries/external/LenderActions.sol:341), so a move from an aged deposit, including a zero amount move (src/libraries/external/LenderActions.sol:204), lets a fresh deposit be withdrawn without the fee that would remain in pool reserves
        locations:
          - {file: src/libraries/external/LenderActions.sol, line: 204}
          - {file: src/libraries/external/LenderActions.sol, line: 278}
          - {file: src/libraries/external/LenderActions.sol, line: 341}
      - id: nft-take-remaining-collateral-accounting-error
        root_cause: Auctions.take and Auctions.bucketTake never set result_.remainingCollateral (src/libraries/external/Auctions.sol:583, src/libraries/external/Auctions.sol:517) while Auctions._takeLoan writes the collateral left after settlement only to the borrower record (src/libraries/external/Auctions.sol:1034), so ERC721Pool.take and bucketTake call _rebalanceTokens with zero (src/ERC721Pool.sol:460, src/ERC721Pool.sol:517) and move all of the borrower's NFTs out of the borrower's token list
        locations:
          - {file: src/ERC721Pool.sol, line: 460}
          - {file: src/ERC721Pool.sol, line: 517}
          - {file: src/libraries/external/Auctions.sol, line: 517}
          - {file: src/libraries/external/Auctions.sol, line: 583}
          - {file: src/libraries/external/Auctions.sol, line: 1034}
      - id: position-bankrupt-lps-accounting-error
        root_cause: PositionManager records each token's LPs in positionLPs (src/PositionManager.sol:161) and lets moveLiquidity move quote tokens against that record (src/PositionManager.sol:232, src/PositionManager.sol:259) without checking whether the bucket went bankrupt after memorialization, so a position whose LPs a bankruptcy wiped moves the LPs that later memorializations placed in PositionManager's shared balance
        locations:
          - {file: src/PositionManager.sol, line: 161}
          - {file: src/PositionManager.sol, line: 232}
          - {file: src/PositionManager.sol, line: 259}
      - id: position-deposit-time-accounting-error
        root_cause: LenderActions.transferLPs sets the receiver's depositTime to the later of both deposit times (src/libraries/external/LenderActions.sol:547) while PositionManager is the single lender for every position in a bucket, so one memorialization refreshes the deposit time of every other position in that bucket and their later moves and withdrawals pay the early withdrawal fee
        locations:
          - {file: src/libraries/external/LenderActions.sol, line: 547}
      - id: pull-collateral-lup-pricing-error
        root_cause: BorrowerActions.drawDebt lets a borrower pull collateral down to the amount the current LUP encumbers (src/libraries/external/BorrowerActions.sol:321, src/libraries/external/BorrowerActions.sol:323), and a LUP raised by deposit in a bucket priced far above the market satisfies that check, so a loan left undercollateralized at the market price is kicked and Auctions.settlePoolDebt pays its remaining debt from pool reserves (src/libraries/external/Auctions.sol:280)
        locations:
          - {file: src/libraries/external/Auctions.sol, line: 280}
          - {file: src/libraries/external/BorrowerActions.sol, line: 321}
          - {file: src/libraries/external/BorrowerActions.sol, line: 323}
      - id: rewards-cap-denial-of-service
        root_cause: RewardsManager keys rewardsClaimed and updateRewardsClaimed by epoch across all pools (src/RewardsManager.sol:70, src/RewardsManager.sol:71) while each cap is computed per pool, so rewardsCap - rewardsClaimedInEpoch (src/RewardsManager.sol:611, src/RewardsManager.sol:437) underflows once other pools' claims exceed a pool's cap and reverts claims, stakes, and unstakes for that pool
        locations:
          - {file: src/RewardsManager.sol, line: 70}
          - {file: src/RewardsManager.sol, line: 71}
          - {file: src/RewardsManager.sol, line: 437}
          - {file: src/RewardsManager.sol, line: 611}
      - id: rewards-update-pool-missing-permission
        root_cause: RewardsManager.updateBucketExchangeRatesAndClaim (src/RewardsManager.sol:210) accepts an arbitrary pool_ and computes the AJNA reward from that contract's currentBurnEpoch and accumulators (src/RewardsManager.sol:562, src/RewardsManager.sol:585) without checking that it is an Ajna pool, so the reward paid from the manager's balance is set by an untrusted contract
        locations:
          - {file: src/RewardsManager.sol, line: 210}
          - {file: src/RewardsManager.sol, line: 562}
          - {file: src/RewardsManager.sol, line: 585}
      - id: settle-auction-boundary-accounting-error
        root_cause: Auctions.settlePoolDebt allows settlement once block.timestamp - kickTime reaches exactly 72 hours (src/libraries/external/Auctions.sol:215) while _revertIfAuctionClearable still allows deposit removal at that instant (src/libraries/helpers/RevertsHelper.sol:54), so a depositor removes deposit and settles in one block and leaves the bad debt to others
        locations:
          - {file: src/libraries/external/Auctions.sol, line: 215}
          - {file: src/libraries/helpers/RevertsHelper.sol, line: 54}
      - id: settle-dust-deposit-denial-of-service
        root_cause: Pool.addQuoteToken only rounds the amount to the dust limit (src/base/Pool.sol:139) and accepts a deposit of any size in any bucket while Auctions.settlePoolDebt consumes one bucket per bucketDepth step (src/libraries/external/Auctions.sol:221, src/libraries/external/Auctions.sol:284), so dust buckets added above the highest priced bucket delay settlement from writing off bad debt
        locations:
          - {file: src/base/Pool.sol, line: 139}
          - {file: src/libraries/external/Auctions.sol, line: 221}
          - {file: src/libraries/external/Auctions.sol, line: 284}
      - id: settle-reserves-accounting-error
        root_cause: ERC20Pool.settle and ERC721Pool.settle add the raw balanceOf returned by Pool._getPoolQuoteTokenBalance (src/base/Pool.sol:511) to WAD-scaled debt and deposit values without applying the quote token scale (src/ERC20Pool.sol:362, src/ERC721Pool.sol:359), so for quote tokens with fewer than 18 decimals the reserves passed to Auctions.settlePoolDebt (src/libraries/external/Auctions.sol:280) are zero or near zero and bad debt is forgiven from lender deposits instead of pool reserves
        locations:
          - {file: src/ERC20Pool.sol, line: 362}
          - {file: src/ERC721Pool.sol, line: 359}
          - {file: src/base/Pool.sol, line: 511}
      - id: take-callee-missing-permission
        root_cause: ERC20Pool.take and ERC721Pool.take pull the quote token payment from the caller-supplied callee_ (src/ERC20Pool.sol:460, src/ERC721Pool.sol:463) instead of msg.sender, so any address that approved the pool pays for a take it never requested
        locations:
          - {file: src/ERC20Pool.sol, line: 460}
          - {file: src/ERC721Pool.sol, line: 463}
      - id: transfer-lps-bankrupt-balance-accounting-error
        root_cause: LenderActions.transferLPs adds the transferred LPs to the receiver's balance (src/libraries/external/LenderActions.sol:545) and raises the receiver's depositTime (src/libraries/external/LenderActions.sol:547) without first clearing a balance recorded before the bucket's bankruptcy, as Buckets.addLenderLPs does (src/libraries/internal/Buckets.sol:82), so LPs wiped by a bankruptcy become redeemable against later depositors' funds
        locations:
          - {file: src/libraries/external/LenderActions.sol, line: 545}
          - {file: src/libraries/external/LenderActions.sol, line: 547}
