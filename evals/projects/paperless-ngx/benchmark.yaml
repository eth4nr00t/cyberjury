id: paperless-ngx
repository:
  url: https://github.com/paperless-ngx/paperless-ngx
  commit: 6f3451bce0d0bd4b97199ca057002be34c2705bf
cases:
  - id: repository-6f3451b
    kind: repository
    checks:
      - id: webhook-ssrf
        root_cause: send_webhook validates only the first resolved IP of the URL host, then httpx re-resolves it at request time, so the private-address block is not pinned to the connection actually made
        locations:
          - {file: src/documents/signals/handlers.py, symbol: send_webhook}
      - id: webhook-address-filter-ssrf
        root_cause: _is_public_ip treats an address as internal only when ipaddress reports it private, loopback, link-local, multicast or unspecified (src/documents/signals/handlers.py:680), so RFC 6598 shared address space 100.64.0.0/10 destinations count as public and pass send_webhook's internal-request block (src/documents/signals/handlers.py:727)
        locations:
          - {file: src/documents/signals/handlers.py, symbol: _is_public_ip}
      - id: matching-regex-denial-of-service
        root_cause: matches() runs user-defined MATCH_REGEX patterns with re.search over the full document content with no timeout or complexity bound on the regex evaluation
        locations:
          - {file: src/documents/matching.py, symbol: matches}
      - id: confirm-dialog-stored-xss
        root_cause: BulkEditorComponent interpolates tag/correspondent/type/path/custom field names into confirm-dialog messages, which confirm-dialog renders via [innerHTML] through the sanitizer-bypassing safeHtml pipe
        locations:
          - {file: src-ui/src/app/components/common/confirm-dialog/confirm-dialog.component.html, line: 11}
          - {file: src-ui/src/app/components/document-list/bulk-editor/bulk-editor.component.ts, line: 411}
          - {file: src-ui/src/app/pipes/safehtml.pipe.ts, symbol: SafeHtmlPipe}
      - id: storage-path-template-path-traversal
        root_cause: FilePathTemplate.render, called from validate_filepath_template_and_render, only strips leading and trailing separators from rendered storage-path and filename templates (src/documents/templating/filepath.py:48) and never rejects '..' components, and the target is not confined to ORIGINALS_DIR/ARCHIVE_DIR before files move
        locations:
          - {file: src/documents/templating/filepath.py, symbol: validate_filepath_template_and_render}
          - {file: src/documents/signals/handlers.py, symbol: update_filename_and_move_files}
      - id: owned-object-update-missing-permission
        root_cause: OwnedObjectSerializer.update applies owner and set_permissions changes without requiring the requester to be the object's owner or a superuser, so any change-permission holder can reassign or regrant objects
        locations:
          - {file: src/documents/serialisers.py, symbol: OwnedObjectSerializer.update}
          - {file: src/documents/serialisers.py, symbol: DocumentSerializer}
          - {file: src/documents/serialisers.py, line: 389}
          - {file: src/documents/serialisers.py, line: 608}
      - id: document-upload-missing-permission
        root_cause: PostDocumentView (document upload) requires only IsAuthenticated and never checks the documents.add_document model permission
        locations:
          - {file: src/documents/views.py, symbol: PostDocumentView.post}
      - id: storage-path-test-idor
        root_cause: StoragePathViewSet.test drops to IsAuthenticated and StoragePathTestSerializer.document accepts any Document id, so templates render against documents the caller has no view permission on
        locations:
          - {file: src/documents/serialisers.py, symbol: StoragePathTestSerializer}
          - {file: src/documents/views.py, symbol: StoragePathViewSet.test}
      - id: storage-path-template-information-disclosure
        root_cause: validate_filepath_template_and_render puts the live Document ORM object in the Jinja context (the sandbox blocks only save/delete/update), and the test action returns the render, exposing related rows
        locations:
          - {file: src/documents/templating/filepath.py, symbol: validate_filepath_template_and_render}
          - {file: src/documents/views.py, symbol: StoragePathViewSet.test}
      - id: share-link-idor
        root_cause: ShareLinkSerializer accepts any document id on create and update without checking the requester's view or change permission on that document
        locations:
          - {file: src/documents/serialisers.py, symbol: ShareLinkSerializer}
      - id: user-create-privilege-escalation
        root_cause: UserViewSet.create guards superuser creation with an identity test (request.data is_superuser is True) instead of checking the validated boolean, so non-bool truthy values pass
        locations:
          - {file: src/paperless/views.py, symbol: UserViewSet.create}
          - {file: src/paperless/views.py, symbol: UserViewSet.update}
      - id: user-delete-privilege-escalation
        root_cause: UserViewSet has no destroy guard, so a non-superuser holding delete_user can delete superuser accounts, while only create and update enforce the superusers-only-by-superusers rule
        locations:
          - {file: src/paperless/views.py, symbol: UserViewSet}
      - id: global-search-mail-information-disclosure
        root_cause: GlobalSearchView queries MailRule and MailAccount gated only by the global view permission instead of get_objects_for_user_owner_aware, returning other users' mail rules and accounts
        locations:
          - {file: src/documents/views.py, line: 2043}
          - {file: src/documents/views.py, line: 2049}
      - id: edit-pdf-denial-of-service
        root_cause: edit_pdf allocates max(doc)+1 output PDFs from a caller-supplied per-operation doc index that _validate_parameters_edit_pdf only type-checks and never bounds
        locations:
          - {file: src/documents/bulk_edit.py, line: 578}
      - id: document-link-missing-permission
        root_cause: reflect_doclinks writes symmetric document-link custom field values into every target document id without checking the editor's change_document permission on those targets
        locations:
          - {file: src/documents/bulk_edit.py, line: 674}
      - id: consume-folder-symlink-following
        root_cause: _consume in the consume-folder watcher follows symlinks (stat/is_file/open) and enqueues files without rejecting links or paths that resolve outside CONSUMPTION_DIR
        locations:
          - {file: src/documents/management/commands/document_consumer.py, line: 134}
      - id: tag-children-information-disclosure
        root_cause: TagSerializer.get_children serializes every child from get_children_queryset() without filtering to tags the requester may view, so a visible parent exposes private child tags
        locations:
          - {file: src/documents/serialisers.py, line: 584}
      - id: selection-data-idor
        root_cause: SelectionDataView accepts document ids validated only for existence (DocumentListSerializer) and aggregates their tags, correspondents, types and custom fields without per-document view checks
        locations:
          - {file: src/documents/serialisers.py, line: 1370}
      - id: bulk-edit-split-denial-of-service
        root_cause: _validate_parameters_split materializes every page of caller-supplied a-b ranges via range() with no size bound, and this validation runs before BulkEditView's permission check
        locations:
          - {file: src/documents/serialisers.py, line: 1593}
      - id: note-delete-idor
        root_cause: DocumentViewSet.notes authorizes the URL document on DELETE but fetches the note with Note.objects.get(id=...) without a document=doc filter, so any note id can be deleted
        locations:
          - {file: src/documents/views.py, line: 1062}
      - id: bulk-edit-originals-missing-permission
        root_cause: BulkEditView's ownership clause for original-modifying calls (edit_pdf update_document, merge/split delete_originals) replaces has_perms instead of AND-ing it, skipping the change_document check
        locations:
          - {file: src/documents/views.py, line: 1542}
      - id: mail-rule-account-idor
        root_cause: MailRuleSerializer's AccountField uses MailAccount.objects.all(), so a rule can be bound to a mail account the requester neither owns nor has object permission on
        locations:
          - {file: src/paperless_mail/serialisers.py, line: 57}
      - id: mail-test-idor
        root_cause: MailAccountViewSet.test loads MailAccount.objects.get(pk=request id) and reuses its stored password and OAuth token without an owner or object-permission check on that account
        locations:
          - {file: src/paperless_mail/views.py, line: 95}
      - id: mail-linkify-denial-of-service
        root_cause: MailDocumentParser.mail_to_html runs bleach linkify with parse_email=True in its clean_html helper (src/paperless_mail/parsers.py:304) over unbounded mail fields including the full body text (src/paperless_mail/parsers.py:336), and the email pattern of the pinned bleach 6.3.0 retries a linear dot-atom scan at every start offset, so processing time grows quadratically with message length
        locations:
          - {file: src/paperless_mail/parsers.py, symbol: MailDocumentParser.mail_to_html}
      - id: bulk-download-zip-name-denial-of-service
        root_cause: BulkArchiveStrategy picks unique zip entry names by rescanning zipf.namelist() in a counter loop for every document, with no cap on the number of requested documents
        locations:
          - {file: src/documents/bulk_download.py, line: 38}
      - id: search-more-like-idor
        root_cause: DelayedMoreLikeThisQuery builds full-text more_like_id results from any document id's content without checking that the requester can view that document
        locations:
          - {file: src/documents/index.py, line: 463}
      - id: document-upload-information-disclosure
        root_cause: ConsumerPlugin._parse_title_placeholders resolves the {{correspondent}} and {{document_type}} title placeholders by loading the caller-supplied ids (src/documents/consumer.py:589) that PostDocumentSerializer accepts from unscoped querysets (src/documents/serialisers.py:1737, src/documents/serialisers.py:1745) without checking the uploader's view permission, so names of objects shown as Private elsewhere are written into the uploader's document title
        locations:
          - {file: src/documents/consumer.py, symbol: ConsumerPlugin._parse_title_placeholders}
          - {file: src/documents/serialisers.py, line: 1737}
          - {file: src/documents/serialisers.py, line: 1745}
      - id: consumption-task-missing-owner
        root_cause: TasksViewSet shows every owner=None task to all users and TasksViewSerializer returns its result text, while system-created consumption tasks are stored without an owner
        locations:
          - {file: src/documents/serialisers.py, line: 2049}
      - id: bulk-download-temp-file-denial-of-service
        root_cause: BulkDownloadView writes the zip to NamedTemporaryFile(delete=False) in SCRATCH_DIR and never unlinks it after the response is built
        locations:
          - {file: src/documents/views.py, line: 2275}
      - id: oauth-mail-account-missing-owner
        root_cause: OauthCallbackView creates the OAuth MailAccount via update_or_create without owner=request.user, leaving the account and its token ownerless and visible to every mail-permission holder
        locations:
          - {file: src/paperless_mail/views.py, line: 245}
      - id: storage-path-template-denial-of-service
        root_cause: validate_filepath_template_and_render renders storage-path templates in a Jinja SandboxedEnvironment that does not intercept binary operators or bound output size, so string multiplication in a path template allocates unbounded memory at render
        locations:
          - {file: src/documents/templating/filepath.py, line: 310}
      - id: mail-test-missing-permission
        root_cause: MailAccountViewSet.get_permissions downgrades the test action to IsAuthenticated, so users without mail-account model permission can make the server open IMAP connections and logins to any caller-chosen host and port (src/paperless_mail/views.py:102)
        locations:
          - {file: src/paperless_mail/views.py, line: 77}
          - {file: src/paperless_mail/views.py, line: 102}
          - {file: src/paperless_mail/views.py, line: 80}
      - id: tag-parent-missing-permission
        root_cause: TagViewSet.perform_update calls update_document_parent_tags on reparenting, which adds the parent tags to every document carrying the tag without checking change_document on those documents
        locations:
          - {file: src/documents/tasks.py, symbol: update_document_parent_tags}
          - {file: src/documents/views.py, line: 458}
      - id: release-changelog-injection
        root_cause: append-Changelog (.github/workflows/ci.yml:666) expands the release body built from PR titles via ${{ }} directly inside its shell script instead of passing it through an env variable
        locations:
          - {file: .github/workflows/ci.yml, line: 666}
          - {file: .github/workflows/ci.yml, line: 598}
          - {file: .github/release-drafter.yml, line: 48}
      - id: edit-pdf-delete-original-missing-permission
        root_cause: BulkEditView's delete_document check and _validate_parameters_edit_pdf ignore edit_pdf's delete_original parameter, so edit_pdf deletes the source document without delete permission
        locations:
          - {file: src/documents/views.py, line: 1577}
          - {file: src/documents/bulk_edit.py, line: 633}
          - {file: src/documents/serialisers.py, symbol: BulkEditSerializer._validate_parameters_edit_pdf}
      - id: admin-user-privilege-escalation
        root_cause: PaperlessUserAdmin guards only superuser-flag changes, not edits, password resets or deletion of superuser targets by non-superuser staff, and is_staff is self-grantable via the user API
        locations:
          - {file: src/paperless/admin.py, symbol: PaperlessUserAdmin}
          - {file: src/paperless/admin.py, symbol: PaperlessUserForm.clean}
          - {file: src/paperless/serialisers.py, line: 85}
      - id: suggestions-cache-information-disclosure
        root_cause: get_suggestion_cache_key keys cached suggestions by document id only, so one user's permission-filtered suggestions are replayed to other users requesting that document
        locations:
          - {file: src/documents/caching.py, symbol: get_suggestion_cache_key}
          - {file: src/documents/views.py, line: 905}
      - id: duplicate-check-information-disclosure
        root_cause: ConsumerPreflightPlugin.pre_check_duplicate puts the existing duplicate's title and id in the failure message without checking that the uploader can view that document
        locations:
          - {file: src/documents/consumer.py, symbol: ConsumerPreflightPlugin.pre_check_duplicate}
          - {file: src/documents/consumer.py, line: 789}
      - id: last-correspondence-information-disclosure
        root_cause: CorrespondentViewSet annotates last_correspondence with Max over all documents instead of applying the user's document permission filter to the aggregate
        locations:
          - {file: src/documents/views.py, line: 413}
          - {file: src/documents/views.py, line: 419}
      - id: path-check-symlink-following
        root_cause: path_check creates its predictable __paperless_write_test_<pid>__ probe with open('w'), which follows a symlink planted in a writable checked directory instead of creating exclusively
        locations:
          - {file: src/paperless/checks.py, symbol: path_check}
          - {file: src/paperless/checks.py, line: 33}
      - id: processed-mail-missing-owner
        root_cause: ProcessedMail records created in error_callback and the no-attachment path (src/paperless_mail/mail.py:889) omit owner=rule.owner, so the ownerless records are visible to every user
        locations:
          - {file: src/paperless_mail/mail.py, symbol: error_callback}
          - {file: src/paperless_mail/mail.py, line: 889}
      - id: document-etag-information-disclosure
        root_cause: metadata_etag and preview_etag derive ETags from document checksums in the condition decorator, which runs before the view's object-permission check, so they leak for unviewable documents
        locations:
          - {file: src/documents/conditionals.py, symbol: metadata_etag}
          - {file: src/documents/conditionals.py, symbol: preview_etag}
          - {file: src/documents/views.py, line: 827}
      - id: failed-login-log-injection
        root_cause: handle_failed_login writes the client-supplied username into the paperless.auth log without escaping CR/LF or control characters, so forged lines reach log parsers such as fail2ban
        locations:
          - {file: src/paperless/signals.py, symbol: handle_failed_login}
          - {file: src/paperless/signals.py, line: 19}
      - id: trash-missing-permission
        root_cause: TrashView requires only IsAuthenticated with no documents model permission, and its owner-aware check passes ownerless documents, so any user can list, restore or empty them
        locations:
          - {file: src/documents/views.py, symbol: TrashView}
          - {file: src/documents/views.py, line: 3113}
          - {file: src/documents/views.py, line: 3137}
      - id: bulk-download-missing-permission
        root_cause: BulkDownloadView requires only IsAuthenticated, not the documents.view_document model permission, and has_perms_owner_aware passes ownerless documents, so their files download
        locations:
          - {file: src/documents/views.py, symbol: BulkDownloadView.post}
          - {file: src/documents/views.py, line: 2256}
      - id: workflow-template-information-disclosure
        root_cause: email_action and webhook_action pass the live Correspondent model instead of its name into consumption-trigger workflow templates (src/documents/signals/handlers.py:1125, src/documents/signals/handlers.py:1244), exposing related ORM rows
        locations:
          - {file: src/documents/signals/handlers.py, line: 1125}
          - {file: src/documents/signals/handlers.py, line: 1244}
          - {file: src/documents/templating/workflows.py, symbol: parse_w_workflow_placeholders}
      - id: api-login-authentication-bypass
        root_cause: rest_framework.urls mounted at /api/auth/ (src/paperless/urls.py:92) and admin.site.urls (src/paperless/urls.py:235) serve login views that create sessions from a password alone, skipping allauth MFA and the DISABLE_REGULAR_LOGIN check
        locations:
          - {file: src/paperless/urls.py, line: 92}
          - {file: src/paperless/urls.py, line: 235}
      - id: password-reset-host-header-injection
        root_cause: get_reset_password_from_key_url builds reset links from the request Host when PAPERLESS_URL is unset, and ALLOWED_HOSTS defaults to *, so the emailed link can point at an attacker host
        locations:
          - {file: src/paperless/adapter.py, symbol: CustomAccountAdapter.get_reset_password_from_key_url}
          - {file: src/paperless/settings.py, line: 607}
      - id: search-correction-information-disclosure
        root_cause: DelayedFullTextQuery corrects queries with Whoosh correct_query over the whole index lexicon (src/documents/index.py:447) and returns corrected_query, exposing terms from documents the user cannot view
        locations:
          - {file: src/documents/index.py, line: 447}
          - {file: src/documents/views.py, line: 1340}
