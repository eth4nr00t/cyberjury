          - {file: src/documents/admin.py, symbol: NotesAdmin}
          - {file: src/documents/admin.py, symbol: ShareLinksAdmin}
          - {file: src/paperless/urls.py, line: 235}
      - id: document-etag-information-disclosure
        root_cause: metadata_etag and preview_etag derive ETags from document checksums (src/documents/conditionals.py:69, src/documents/conditionals.py:96) in the condition decorator, which runs before the view's object-permission check (src/documents/views.py:827), so the checksums of documents the user cannot view leak through ETag headers
        locations:
          - {file: src/documents/conditionals.py, symbol: metadata_etag}
          - {file: src/documents/conditionals.py, symbol: preview_etag}
          - {file: src/documents/views.py, line: 827}
