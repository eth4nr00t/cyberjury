      - id: double-sided-collation-missing-permission
        root_cause: CollatePlugin.able_to_run enables collation whenever CONSUMER_COLLATE_DOUBLE_SIDED_SUBDIR_NAME equals any part of the input path, including the file's own name, without limiting it to consume-folder files inside that subdirectory (src/documents/double_sided.py:36), so API uploads and mail attachments named after the subdirectory are collated against the single staging file shared by all users (src/documents/double_sided.py:74), deleting a pending odd-page scan (src/documents/double_sided.py:131) or replacing it as staging (src/documents/double_sided.py:134)
