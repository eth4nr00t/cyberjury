cases:
  - id: repository-6f3451b
    kind: repository
    checks:
      - id: admin-user-privilege-escalation
        root_cause: PaperlessUserForm.clean blocks only superuser-flag changes by non-superusers (src/paperless/admin.py:27), not their edits, password resets or deletion of superuser accounts through PaperlessUserAdmin (src/paperless/admin.py:43), and the user API leaves is_staff writable (src/paperless/serialisers.py:95), so a staff user without superuser rights takes over superuser accounts
        locations:
          - {file: src/paperless/admin.py, symbol: PaperlessUserAdmin}
          - {file: src/paperless/admin.py, symbol: PaperlessUserForm.clean}
          - {file: src/paperless/serialisers.py, line: 95}
      - id: api-login-authentication-bypass
        root_cause: rest_framework.urls mounted at /api/auth/ (src/paperless/urls.py:92) and admin.site.urls (src/paperless/urls.py:235) serve login views that create sessions from a password alone, skipping allauth MFA and the DISABLE_REGULAR_LOGIN check, so a known password signs in to an account protected by MFA or with regular login disabled
        locations:
          - {file: src/paperless/urls.py, line: 92}
          - {file: src/paperless/urls.py, line: 235}
      - id: bulk-download-missing-permission
        root_cause: BulkDownloadView requires only IsAuthenticated (src/documents/views.py:2256), not the documents.view_document model permission, and its has_perms_owner_aware check passes ownerless documents (src/documents/views.py:2271), so users without document view permission download the files of ownerless documents
        locations:
          - {file: src/documents/views.py, line: 2256}
          - {file: src/documents/views.py, symbol: BulkDownloadView.post}
      - id: bulk-download-temp-file-denial-of-service
        root_cause: BulkDownloadView writes each zip to NamedTemporaryFile(delete=False) in SCRATCH_DIR (src/documents/views.py:2275) and never unlinks it after the response is built, so repeated bulk downloads fill the scratch disk
        locations:
          - {file: src/documents/views.py, line: 2275}
      - id: bulk-download-zip-name-denial-of-service
        root_cause: BulkArchiveStrategy picks unique zip entry names by rescanning zipf.namelist() in a counter loop for every document (src/documents/bulk_download.py:38), with no cap on the number of requested documents, so one bulk download of many same-named documents takes quadratic time and ties up a worker
        locations:
          - {file: src/documents/bulk_download.py, line: 38}
      - id: bulk-edit-originals-missing-permission
        root_cause: BulkEditView's ownership clause for calls that change originals, including edit_pdf with update_document and merge or split with delete_originals (src/documents/views.py:1542), replaces has_perms with an owner-or-ownerless test instead of AND-ing it (src/documents/views.py:1560), so a user without change_document permission rewrites the originals of documents they own or that have no owner
        locations:
          - {file: src/documents/views.py, line: 1542}
      - id: bulk-edit-split-denial-of-service
        root_cause: _validate_parameters_split materializes every page of caller-supplied a-b ranges via range() with no size bound (src/documents/serialisers.py:1593), and this validation runs before BulkEditView's permission check, so one bulk edit request with a huge page range exhausts worker memory
        locations:
          - {file: src/documents/serialisers.py, line: 1593}
      - id: confirm-dialog-stored-xss
        root_cause: BulkEditorComponent interpolates tag, correspondent, document type, storage path and custom field names into confirm-dialog messages (src-ui/src/app/components/document-list/bulk-editor/bulk-editor.component.ts:411), which confirm-dialog renders via [innerHTML] through the sanitizer-bypassing SafeHtmlPipe (src-ui/src/app/components/common/confirm-dialog/confirm-dialog.component.html:11, src-ui/src/app/pipes/safehtml.pipe.ts:7), so markup in an object name runs script in the session of a user who bulk edits with it
        locations:
          - {file: src-ui/src/app/components/common/confirm-dialog/confirm-dialog.component.html, line: 11}
          - {file: src-ui/src/app/components/document-list/bulk-editor/bulk-editor.component.ts, line: 411}
          - {file: src-ui/src/app/pipes/safehtml.pipe.ts, symbol: SafeHtmlPipe}
      - id: consume-folder-symlink-following
        root_cause: _consume in the consume-folder watcher follows symlinks through stat, is_file and open and enqueues the file (src/documents/management/commands/document_consumer.py:134) without rejecting links or paths that resolve outside CONSUMPTION_DIR, so a symlink placed in the consume folder imports any file the service can read
        locations:
          - {file: src/documents/management/commands/document_consumer.py, line: 134}
      - id: consumption-task-missing-owner
        root_cause: TasksViewSet shows every owner=None task to all users and TasksViewSerializer returns its result text (src/documents/serialisers.py:2049), while system-created consumption tasks are stored without an owner, so every user reads the result messages of consumption tasks run for other users' files
        locations:
          - {file: src/documents/serialisers.py, line: 2049}
      - id: django-admin-idor
        root_cause: DocumentAdmin.get_queryset returns Document.global_objects.all() (src/documents/admin.py:100) and the other GuardedModelAdmin classes keep the unfiltered default queryset and Django's model-level has_view/change/delete_permission, so the /admin/ backend (src/paperless/urls.py:235) authorizes staff users by global model permission alone and ignores owner and object-level permissions on documents, notes, share links and custom field values
        locations:
