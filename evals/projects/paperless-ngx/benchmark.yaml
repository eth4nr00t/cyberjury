      - id: document-upload-information-disclosure
        root_cause: ConsumerPlugin._parse_title_placeholders resolves the {{correspondent}} and {{document_type}} title placeholders by loading the caller-supplied ids (src/documents/consumer.py:589) that PostDocumentSerializer accepts from unscoped querysets (src/documents/serialisers.py:1737, src/documents/serialisers.py:1745) without checking the uploader's view permission, so names of objects shown as Private elsewhere are written into the uploader's document title
        locations:
