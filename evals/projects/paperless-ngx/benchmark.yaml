      - id: edit-pdf-delete-original-missing-permission
        root_cause: BulkEditView's delete_document check (src/documents/views.py:1577) and _validate_parameters_edit_pdf (src/documents/serialisers.py:1633) ignore edit_pdf's delete_original parameter, which deletes the source document after the split (src/documents/bulk_edit.py:633), so a user without delete permission deletes documents
