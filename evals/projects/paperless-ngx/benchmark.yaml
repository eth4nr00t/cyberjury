          - {file: src/documents/serialisers.py, line: 1745}
      - id: document-upload-missing-permission
        root_cause: PostDocumentView requires only IsAuthenticated (src/documents/views.py:1661) and its post handler never checks the documents.add_document model permission (src/documents/views.py:1665), so users without add permission upload and create documents
        locations:
