      - id: ssh-handshake-denial-of-service
        root_cause: The built-in SSH server listen loop runs ssh.NewServerConn on each accepted connection (internal/ssh/ssh.go:128) with no handshake deadline, so unauthenticated connections that stall the handshake hold file descriptors and goroutines indefinitely
        locations:
