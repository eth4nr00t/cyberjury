          - {file: internal/route/user/auth.go, line: 223}
      - id: unlisted-action-information-disclosure
        root_cause: NewIssue and createComment set the action IsPrivate from repo.IsPrivate alone (internal/database/issue.go:784, internal/database/comment.go:211) rather than repo.IsPrivate or repo.IsUnlisted as other actions do, so issue and comment activity of unlisted repositories appears in the public profile feed
        locations:
