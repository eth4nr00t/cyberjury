      - id: same-site-check-open-redirect
        root_cause: urlutil.IsSameSite checks only that the redirect target begins with a slash and that its second byte is not a slash or backslash (internal/urlutil/urlutil.go:4), so a value such as a slash, a tab, and another slash passes the same-site test and browsers reparse it as a scheme-relative external URL
