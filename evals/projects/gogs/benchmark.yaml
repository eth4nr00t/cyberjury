      - id: webhook-dns-rebinding-ssrf
        root_cause: HookTask.deliver checks the payload host with a separate DNS lookup (internal/database/webhook.go:701, internal/netutil/netutil.go:56) and httplib then dials the hostname again with no address check (internal/httplib/httplib.go:305), so a hostname that resolves differently at delivery time reaches internal addresses
        locations:
