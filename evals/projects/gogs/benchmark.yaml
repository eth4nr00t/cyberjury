        root_cause: Releases and the v1 Releases API load draft releases with GetDraftReleasesByRepoID and return them to every reader without a writer-access check (internal/route/repo/release.go:116, internal/route/api/v1/repo/repo.go:454), so unpublished draft notes and attachments reach readers including anonymous users on public repositories
