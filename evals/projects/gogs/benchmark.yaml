      - id: user-avatar-denial-of-service
        root_cause: The user avatar upload checks only the sniffed content type (internal/route/user/setting.go:154) and fully decodes the image with image.Decode (internal/userutil/userutil.go:86) without a DecodeConfig dimension limit, so a small image with huge dimensions exhausts server memory
