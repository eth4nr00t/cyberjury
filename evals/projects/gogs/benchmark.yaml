      - id: totp-login-authentication-bypass
        root_cause: LoginTwoFactorPost redirects back on an invalid TOTP code while keeping the pending user in the session (internal/route/user/auth.go:220) with no attempt counter or throttling, so the second factor of a user whose password is known can be guessed without limit
        locations:
