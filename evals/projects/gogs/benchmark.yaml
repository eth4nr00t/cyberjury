      - id: upload-symlink-following
        root_cause: Repository.UploadRepoFiles rejects only a target whose final path component is a symlink (internal/database/repo_editor.go:605) and does not check its parent directories, so an upload under a committed symlinked directory writes outside the repository working tree
        locations:
