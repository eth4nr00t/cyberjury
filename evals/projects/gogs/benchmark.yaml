      - id: smtp-login-information-disclosure
        root_cause: The mailer uses STARTTLS only when the server advertises it (internal/email/message.go:150) and the custom LoginAuth.Start sends credentials without checking ServerInfo.TLS (internal/email/message.go:77), so SMTP credentials go out in cleartext when STARTTLS is stripped on the path to a non-465 server
        locations:
