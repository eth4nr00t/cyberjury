          - {file: internal/cmd/web.go, line: 293}
          - {file: internal/context/auth.go, line: 56}
          - {file: internal/route/admin/notice.go, line: 62}
      - id: assigned-issue-api-information-disclosure
        root_cause: The v1 ListUserIssues queries issues by assignee only (internal/route/api/v1/repo/issue.go:43) and buildIssuesQuery applies no repository access scope in that branch (internal/database/issue.go:929), so collaborators removed from a private repository keep reading their assigned issues
        locations:
          - {file: internal/database/issue.go, line: 929}
          - {file: internal/database/issue.go, line: 933}
          - {file: internal/route/api/v1/repo/issue.go, line: 43}
      - id: attachment-download-idor
        root_cause: The /attachments/:uuid handler serves an attachment looked up by UUID (internal/cmd/web.go:309) without resolving the issue or release repository that owns it and checking the requester's read access, so attachments of private repositories are served to anyone holding the UUID
        locations:
          - {file: internal/cmd/web.go, line: 306}
      - id: attachment-upload-denial-of-service
        root_cause: The configured attachment size limit only sets the multipart memory threshold (internal/context/context.go:266) and NewAttachment copies the whole upload to disk with no size limit (internal/database/attachment.go:73), so any signed-in user stores uploads of unbounded size
        locations:
          - {file: internal/cmd/web.go, line: 335}
          - {file: internal/context/context.go, line: 266}
          - {file: internal/database/attachment.go, line: 73}
      - id: avatar-upload-memory-denial-of-service
        root_cause: The avatar form binding sets no size limit (internal/cmd/web.go:211) and UpdateAvatarSetting reads the whole uploaded file into memory with io.ReadAll before any type or size check (internal/route/user/setting.go:150), so any signed-in user exhausts server memory with a huge upload
        locations:
          - {file: internal/cmd/web.go, line: 211}
          - {file: internal/route/user/setting.go, line: 150}
      - id: backup-restore-denial-of-service
        root_cause: The database restore reads each table with a default bufio.Scanner (internal/database/backup.go:270) and never checks scanner.Err() before reporting success (internal/database/backup.go:314), so one user-created record whose JSON line exceeds 64 KiB silently drops it and every later row of its table on restore
        locations:
          - {file: internal/database/backup.go, line: 270}
          - {file: internal/database/backup.go, line: 314}
      - id: basic-auth-two-factor-authentication-bypass
        root_cause: authenticatedUser accepts an HTTP Basic username and password for every web route (internal/context/auth.go:246) without the two-factor check that interactive login and Git HTTP apply, so a password alone reaches signed-in web settings including the two-factor disable endpoint
        locations:
          - {file: internal/cmd/web.go, line: 227}
          - {file: internal/context/auth.go, line: 238}
          - {file: internal/context/auth.go, line: 246}
      - id: collaboration-access-privilege-escalation
        root_cause: Repository.ChangeCollaborationAccessMode accepts any mode up to AccessModeOwner (internal/database/repo_collaboration.go:129) and never bounds it by the acting user's own access mode, so a repository admin grants collaborators owner access above their own
        locations:
          - {file: internal/database/repo_collaboration.go, symbol: Repository.ChangeCollaborationAccessMode}
          - {file: internal/route/repo/setting.go, symbol: ChangeCollaborationAccessMode}
      - id: collaboration-team-mode-privilege-escalation
        root_cause: ChangeCollaborationAccessMode raises the collaborator mode to the highest Authorize of every organization team the user belongs to (internal/database/repo_collaboration.go:151, internal/database/repo_collaboration.go:156) without checking that the team has this repository, so a read collaborator who is admin in an unrelated team receives admin on the repository
        locations:
          - {file: internal/database/repo_collaboration.go, line: 151}
          - {file: internal/database/repo_collaboration.go, line: 156}
      - id: comment-attachment-idor
        root_cause: createComment loads each submitted attachment by UUID alone (internal/database/comment.go:226) and overwrites its issue and comment ids (internal/database/comment.go:238) without checking that it is unattached or owned by the actor, so a commenter detaches attachments of other issues and deletes them with the comment
        locations:
          - {file: internal/database/comment.go, line: 226}
          - {file: internal/database/comment.go, line: 238}
          - {file: internal/database/comment.go, line: 534}
      - id: commit-reference-missing-permission
        root_cause: updateCommitReferencesToIssues resolves owner/repo#N references with GetIssueByRef (internal/database/actions.go:341) and creates reference comments (internal/database/actions.go:360) without checking the pusher's access to the target repository, so a push to any repository comments on issues of private repositories
