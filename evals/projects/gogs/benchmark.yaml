      - id: slack-webhook-injection
        root_cause: SlackLinkFormatter interpolates the URL unescaped into Slack link markup (internal/database/webhook_slack.go:66) and the pushed ref name enters that URL and the delete message unescaped (internal/database/webhook_slack.go:74, internal/database/webhook_slack.go:85), so ref names inject Slack markup into the configured channel
        locations:
