cases:
  - id: repository-5dcb6c6
    kind: repository
    checks:
      - id: admin-notice-csrf
        root_cause: The admin notice purge is routed as GET (internal/cmd/web.go:293), which skips the CSRF token check that runs only for POST (internal/context/auth.go:56), so a cross-site request from a site admin's browser deletes all system notices
