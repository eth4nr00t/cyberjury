          - {file: internal/httplib/httplib.go, line: 305}
          - {file: internal/netutil/netutil.go, line: 56}
      - id: webhook-redirect-ssrf
        root_cause: HookTask.deliver checks the payload URL host against the local network blocklist (internal/database/webhook.go:701) but sends the request with the HTTP client's default redirect following (internal/database/webhook.go:715), so a redirect from an allowed host reaches internal addresses
        locations:
          - {file: internal/database/webhook.go, line: 701}
          - {file: internal/database/webhook.go, line: 715}
      - id: webhook-task-idor
        root_cause: deleteWebhook ignores whether the repository-scoped webhook delete matched a row (internal/database/webhook.go:321) and then deletes hook tasks by the hook id alone (internal/database/webhook.go:323), so a repository admin deletes delivery history and pending deliveries of other repositories' webhooks
        locations:
