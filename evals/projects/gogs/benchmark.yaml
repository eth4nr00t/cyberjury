      - id: user-search-denial-of-service
        root_cause: The unauthenticated v1 user search passes the limit query unbounded (internal/route/api/v1/user/user.go:18) to searchUserByName, which allocates a slice of that capacity (internal/database/users.go:875), so one request allocates unbounded memory
        locations:
