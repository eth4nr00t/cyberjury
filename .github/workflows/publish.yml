name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          if [[ "$GITHUB_REF_NAME" != v* ]]
          then
            echo "release tag $GITHUB_REF_NAME must start with v"
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$tag_version" != "$pyproject_version" ]
          then
            echo "release tag $tag_version does not match pyproject version $pyproject_version"
            exit 1
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install build twine
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/cyberjury --version
          /tmp/smoke/bin/python -m cyberjury --version
          /tmp/smoke/bin/cyberjury --help
          /tmp/smoke/bin/cyberjury review diff --help
          /tmp/smoke/bin/cyberjury review repository --help
          /tmp/smoke/bin/python - <<'PY'
          from cyberjury.cli import SLASH_COMMAND_FILE
          from cyberjury.review.detection import load_detection
          from cyberjury.review.contract import ContractReceipt
          from cyberjury.review.knowledge import load_review_brief, load_severity_rubric
          from cyberjury.review.syntax.facts import syntax_backend_id
          assert SLASH_COMMAND_FILE.is_file()
          ContractReceipt.capture()
          assert load_review_brief().render()
          assert load_severity_rubric()
          assert load_detection().skip_dirs
          assert syntax_backend_id()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
