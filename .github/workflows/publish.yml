name: Publish to PyPI

# Publishes on GitHub Release. Uses PyPI Trusted Publishing via OIDC, so no API
# token is stored anywhere, PyPI verifies this repository and environment instead.
# The build job verifies the artifact before publish runs. It blocks a release on a tag that
# does not match the packaged version, failing tests, broken metadata, or a wheel that cannot
# load its core bundled resources.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version=$(python -c "import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$tag_version" != "$pyproject_version" ]
          then
            echo "release tag $tag_version does not match pyproject version $pyproject_version"
            exit 1
          fi
      - name: Install tooling
        run: python -m pip install --upgrade build twine
      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build wheel and sdist
        run: |
          rm -rf dist/ build/
          python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Smoke test the built wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/cyberjury --version
          /tmp/smoke/bin/python -m cyberjury --version
          /tmp/smoke/bin/cyberjury review diff --dry-run --format json
          /tmp/smoke/bin/python - <<'PY'
          from cyberjury.resources import SLASH_COMMAND_FILE, DETECTION_FILE
          from cyberjury.review.diff.vulnerabilities import load_vulnerabilities
          from cyberjury.guides import load_guides
          from cyberjury.domains.web.facts.callgraph import TreeSitterCallGraph
          assert SLASH_COMMAND_FILE.is_file()
          assert DETECTION_FILE.is_file()
          assert TreeSitterCallGraph().available()
          assert len(load_vulnerabilities()) >= 20
          assert len(load_guides()) >= 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
