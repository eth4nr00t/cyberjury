name: Feature Request
description: Propose a new capability or a change in behavior.
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Adding a stack or a vulnerability class is
        usually a data change under a domain's content, not an engine change, so note which
        one you expect. English only.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The concrete problem or gap, and who hits it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      description: What you want to happen. Reference the review path or domain it touches.
    validations:
      required: true
  - type: dropdown
    id: shape
    attributes:
      label: Expected Shape
      description: Where you think the change lives.
      options:
        - Data change, knowledge or detection under a domain
        - Engine or CLI change
        - Not sure
