# PR security review with Cyberjury. Copy into .github/workflows/ in your repository.
#
# Audits the pull request's diff, uploads findings to GitHub code scanning as
# SARIF, and fails the check on a HIGH or CRITICAL finding. Set a provider key
# in the repository secrets first, under Settings then Secrets and variables then Actions:
#   CYBERJURY_API_KEY   your model API key
# and, if you go through a gateway, CYBERJURY_API_BASE.

name: Cyberjury Security Review

on:
  pull_request:

permissions:
  contents: read
  security-events: write   # required to upload the SARIF report

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the base ref to diff the PR against

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cyberjury

      - name: Audit the PR diff
        id: review
        env:
          CYBERJURY_API_KEY: ${{ secrets.CYBERJURY_API_KEY }}
          CYBERJURY_API_BASE: ${{ secrets.CYBERJURY_API_BASE }}   # optional: for a gateway
          CYBERJURY_MODEL: claude-sonnet-4-6                     # the cost-conscious tier for CI, the package default is claude-opus-4-8
        run: |
          set +e
          cyberjury review diff \
            --provider anthropic \
            --repository . \
            --git-range "origin/${{ github.base_ref }}...HEAD" \
            --format sarif --fail-on high > cyberjury.sarif
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cyberjury.sarif

      - name: Fail on high or critical findings
        if: always() && steps.review.outputs.rc != '0'
        run: |
          echo "Cyberjury found HIGH or CRITICAL severity issues, see the code scanning tab."
          exit 1
