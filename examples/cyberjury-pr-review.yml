
name: Cyberjury Security Review

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cyberjury

      - name: Audit the PR diff
        id: review
        env:
          CYBERJURY_API_KEY: ${{ secrets.CYBERJURY_API_KEY }}
          CYBERJURY_API_BASE: ${{ secrets.CYBERJURY_API_BASE }}
          CYBERJURY_MODEL: claude-sonnet-4-6
        run: |
          set +e
          cyberjury review diff \
            --provider anthropic \
            --repository . \
            --git-range "origin/${{ github.base_ref }}...HEAD" \
            --format sarif > cyberjury.sarif
          review_rc="$?"
          high_critical="false"
          if [ "$review_rc" -eq 0 ]; then
            high_critical="$(python - <<'PY'
          import json

          with open("cyberjury.sarif", encoding="utf-8") as f:
              doc = json.load(f)
          found = any(
              result.get("level") == "error"
              for run in doc.get("runs", [])
              for result in run.get("results", [])
          )
          print("true" if found else "false")
          PY
          )"
          fi
          echo "review_rc=$review_rc" >> "$GITHUB_OUTPUT"
          echo "high_critical=$high_critical" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cyberjury.sarif

      - name: Fail when the review did not complete
        if: always() && steps.review.outputs.review_rc != '0'
        run: |
          echo "Cyberjury review did not complete, see the workflow logs."
          exit 1

      - name: Fail on high or critical findings
        if: always() && steps.review.outputs.high_critical == 'true'
        run: |
          echo "Cyberjury found HIGH or CRITICAL severity issues, see the code scanning tab."
          exit 1
