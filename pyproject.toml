[project]
name = "cyberjury"
version = "0.2.0"
description = "AI-assisted security review for code diffs and repositories."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "eth4nr00t" }]
keywords = ["appsec", "security", "code review", "llm"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "python-dotenv>=1.0,<2",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16", "pre-commit>=3.5", "jsonschema>=4.0"]

[project.scripts]
cyberjury = "cyberjury.cli:main"

[project.urls]
Homepage = "https://github.com/eth4nr00t/cyberjury"
Repository = "https://github.com/eth4nr00t/cyberjury"
Changelog = "https://github.com/eth4nr00t/cyberjury/releases"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberjury = [
    "commands/*.md",
    "review/contract/*.md",
    "review/contract/detection.yaml",
    "review/syntax/queries.yaml",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests", "evals/tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "ERA", "F", "I", "PGH", "PT", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"
