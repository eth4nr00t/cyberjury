

python:
  extensions: [".py"]
  grammar: [tree_sitter_python, language]
  definitions: |
    [(function_definition name: (identifier) @name)
     (class_definition name: (identifier) @name)] @def
  calls: |
    (call function: [(identifier) @callee (attribute attribute: (identifier) @callee)])
  imports:
    - |
      (import_from_statement module_name: (_) @module (dotted_name (identifier) @imported))
    - |
      (import_from_statement module_name: (_) @module
        (aliased_import name: (dotted_name (identifier) @imported)))
  namespace_imports:
    - |
      (import_statement (dotted_name) @module)
    - |
      (import_statement (aliased_import name: (dotted_name) @module alias: (identifier) @alias))
  namespace_binds: whole
  qualified_calls: |
    (call (attribute object: [(identifier) (attribute)] @qualifier attribute: (identifier) @name))

javascript:
  extensions: [".js", ".jsx", ".mjs", ".cjs"]
  grammar: [tree_sitter_javascript, language]
  definitions: |
    [(function_declaration name: (identifier) @name)
     (class_declaration name: (identifier) @name)
     (method_definition name: (property_identifier) @name)
     (variable_declarator name: (identifier) @name value: [(arrow_function) (function_expression)])
     (assignment_expression
       left: (member_expression
         object: (identifier) @exports
         property: (property_identifier) @name)
       right: [(function_expression) (arrow_function)]
       (#eq? @exports "exports"))
     (assignment_expression
       left: (member_expression
         object: (member_expression
           object: (identifier) @module
           property: (property_identifier) @exports)
         property: (property_identifier) @name)
       right: [(function_expression) (arrow_function)]
       (#eq? @module "module")
       (#eq? @exports "exports"))] @def
  calls: |
    (call_expression function: [(identifier) @callee (member_expression property: (property_identifier) @callee)])
  imports:
    - |
      (import_statement (import_clause (named_imports (import_specifier name: (identifier) @imported)))
        source: (string) @module)
    - |
      (import_statement (import_clause (identifier) @imported) source: (string) @module)
    - |
      (export_statement (export_clause (export_specifier name: (identifier) @imported))
        source: (string) @module)
    - |
      (export_statement "*" @imported source: (string) @module)
    - |
      (variable_declarator
        name: (object_pattern
          [(shorthand_property_identifier_pattern) @imported
           (pair_pattern key: (property_identifier) @imported)])
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require"))
  namespace_imports:
    - |
      (import_statement (import_clause (namespace_import (identifier) @alias))
        source: (string) @module)
    - |
      (variable_declarator
        name: (identifier) @alias
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require"))
  qualified_calls: |
    (call_expression function: (member_expression object: (identifier) @qualifier
      property: (property_identifier) @name))

