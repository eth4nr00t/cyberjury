skip_dirs:
  - ".git"
  - "__pycache__"
  - ".venv"
  - "venv"
  - ".eggs"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".tox"
  - "node_modules"
  - ".next"
  - ".nuxt"
  - "vendor"
  - "build"
  - "dist"
  - "out"
  - "coverage"
  - "htmlcov"

source_extensions:
  - ".py"
  - ".js"
  - ".jsx"
  - ".mjs"
  - ".cjs"
  - ".ts"
  - ".tsx"
  - ".mts"
  - ".cts"
  - ".go"

auto_select_extensions:
  - ".py"
  - ".js"
  - ".jsx"
  - ".mjs"
  - ".cjs"
  - ".ts"
  - ".tsx"
  - ".mts"
  - ".cts"
  - ".go"

patch_extra_extensions:
  - ".html"
  - ".htm"
  - ".sql"
  - ".sh"
  - ".bash"
  - ".zsh"
  - ".ps1"
  - ".graphql"
  - ".gql"
  - ".xml"
  - ".json"
  - ".jinja"
  - ".jinja2"
  - ".j2"
  - ".vue"
  - ".svelte"

patch_names:
  - "Dockerfile"
  - "Containerfile"
  - "Procfile"

patch_definition_patterns:
  - '\b(?:async\s+)?def\s+([A-Za-z_]\w*)\s*\('
  - '\bfunc\s+(?:\([^)]*\)\s*)?([A-Za-z_]\w*)\s*\('
  - '\bfunction\s+([A-Za-z_$][\w$]*)\s*\('
  - '\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:\([^)]*\)|[A-Za-z_$][\w$]*)\s*=>'
  - '\b(?:constructor|fallback|receive)\s*\('
  - '^\s*(?:async\s+)?([A-Za-z_$][\w$]*)\s*\([^;{}]*\)\s*\{'

patch_call_patterns:
  - '\b([A-Za-z_$][A-Za-z0-9_$]*)\s*\('

patch_callable_assignment_patterns:
  - '\b([A-Za-z_$][A-Za-z0-9_$]*)\s*=\s*(?:async\s*)?\('

config_extensions:
  - ".cfg"
  - ".conf"
  - ".env"
  - ".ini"
  - ".toml"
  - ".yaml"
  - ".yml"

manifests:
  - "requirements.txt"
  - "requirements-dev.txt"
  - "setup.py"
  - "setup.cfg"
  - "pyproject.toml"
  - "Pipfile"
  - "package.json"
  - "tsconfig.json"
  - "jsconfig.json"
  - "go.mod"

test_dirs:
  - "__mocks__"
  - "__tests__"
  - "e2e"
  - "spec"
  - "specs"
  - "test"
  - "testdata"
  - "tests"

test_name_patterns:
  - "*_test.*"
  - "*.test.*"
  - "*.spec.*"
  - "test_*"

doc_extensions:
  - ".adoc"
  - ".markdown"
  - ".md"
  - ".mdx"
  - ".rst"
  - ".txt"

lockfiles:
  - "package-lock.json"
  - "npm-shrinkwrap.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "bun.lock"
  - "bun.lockb"
  - "deno.lock"
  - "poetry.lock"
  - "Pipfile.lock"
  - "pdm.lock"
  - "uv.lock"
  - "go.sum"
