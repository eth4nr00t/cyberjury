python:
  extensions: [".py"]
  grammar: [tree_sitter_python, language]
  definitions: |
    [(function_definition name: (identifier) @name)
     (class_definition name: (identifier) @name)] @def
    (decorated_definition definition: (function_definition name: (identifier) @name)) @def
    (decorated_definition definition: (class_definition name: (identifier) @name)) @def
  type_definitions: |
    (class_definition name: (identifier) @name) @type
    (decorated_definition definition: (class_definition name: (identifier) @name)) @type
  calls: |
    (call function: (identifier) @callee arguments: (argument_list) @arguments) @call
    (call function: (attribute object: (_) @receiver attribute: (identifier) @member)
      arguments: (argument_list) @arguments) @call
    (decorator (identifier) @callee) @call
  imports:
    - query: |
        (import_from_statement module_name: (_) @module (dotted_name (identifier) @imported)) @statement
    - query: |
        (import_from_statement module_name: (_) @module
          (aliased_import name: (dotted_name (identifier) @imported) alias: (identifier) @alias)) @statement
    - query: |
        (import_from_statement module_name: (_) @module (wildcard_import) @imported) @statement
  namespace_imports:
    - |
      (import_statement (dotted_name) @module) @statement
    - |
      (import_statement (aliased_import name: (dotted_name) @module alias: (identifier) @alias)) @statement
  qualified_uses: |
    (attribute object: [(identifier) (attribute)] @qualifier attribute: (identifier) @name)

javascript:
  extensions: [".js", ".jsx", ".mjs", ".cjs"]
  grammar: [tree_sitter_javascript, language]
  definitions: |
    [(function_declaration name: (identifier) @name)
     (class_declaration name: (identifier) @name)
     (method_definition name: (property_identifier) @name)
     (variable_declarator name: (identifier) @name value: [(arrow_function) (function_expression)])
     (assignment_expression
       left: (member_expression
         object: (identifier) @exports
         property: (property_identifier) @name)
       right: [(function_expression) (arrow_function)]
       (#eq? @exports "exports"))
     (assignment_expression
       left: (member_expression
         object: (member_expression
           object: (identifier) @module
           property: (property_identifier) @exports)
         property: (property_identifier) @name)
       right: [(function_expression) (arrow_function)]
       (#eq? @module "module")
       (#eq? @exports "exports"))] @def
  type_definitions: |
    (class_declaration name: (identifier) @name) @type
  calls: |
    (call_expression function: (identifier) @callee arguments: (arguments) @arguments) @call
    (call_expression function: (member_expression object: (_) @receiver property: (property_identifier) @member)
      arguments: (arguments) @arguments) @call
  imports:
    - |
      (import_statement
        (import_clause (named_imports (import_specifier name: (identifier) @imported !alias)))
        source: (string) @module) @statement
    - |
      (import_statement
        (import_clause
          (named_imports
            (import_specifier name: (identifier) @imported alias: (identifier) @alias)))
        source: (string) @module) @statement
    - query: |
        (import_statement (import_clause (identifier) @alias) source: (string) @module) @statement
      imported: "default"
    - query: |
        (export_statement (export_clause (export_specifier name: (identifier) @imported !alias))
          source: (string) @module) @statement
    - query: |
        (export_statement
          (export_clause
            (export_specifier name: (identifier) @imported alias: (identifier) @alias))
          source: (string) @module) @statement
    - query: |
        (export_statement "*" source: (string) @module) @statement
      imported: "*"
    - |
      (variable_declarator
        name: (object_pattern (shorthand_property_identifier_pattern) @imported)
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require")) @statement
    - |
      (variable_declarator
        name: (object_pattern
          (pair_pattern key: (property_identifier) @imported value: (identifier) @alias))
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require")) @statement
  namespace_imports:
    - |
      (import_statement (import_clause (namespace_import (identifier) @alias))
        source: (string) @module) @statement
    - |
      (variable_declarator
        name: (identifier) @alias
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require")) @statement
  qualified_uses: |
    (member_expression object: [(identifier) (member_expression)] @qualifier
      property: (property_identifier) @name)

