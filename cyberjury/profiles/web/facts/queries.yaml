go:
  extensions: [".go"]
  unqualified_call_scope: package
  package_name_query: |
    (package_clause (package_identifier) @name)
  resolution_languages: [go]
  module_entries: []
  namespace_resolves_directory: true
  grammar: [tree_sitter_go, language]
  definitions: |
    [(function_declaration name: (identifier) @name) @target
     (method_declaration name: (field_identifier) @name)
     (type_declaration (type_spec name: (type_identifier) @name)) @target] @def
  type_definitions: |
    (type_declaration (type_spec name: (type_identifier) @name)) @type
  calls: |
    (call_expression function: (identifier) @callee)
    (call_expression function: (selector_expression operand: (_) @receiver field: (field_identifier) @member))
  local_receivers: []
  imports: []
  namespace_imports:
    - |
      (import_spec !name path: (interpreted_string_literal) @module)
    - |
      (import_spec name: (package_identifier) @alias path: (interpreted_string_literal) @module)
  namespace_binds: last-segment
  qualified_uses: |
    (selector_expression operand: (identifier) @qualifier field: (field_identifier) @name)
