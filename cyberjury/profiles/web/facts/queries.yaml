python:
  extensions: [".py"]
  unqualified_call_scope: file
  resolution_languages: [python]
  module_entries: ["__init__.py"]
  grammar: [tree_sitter_python, language]
  definitions: |
    [(function_definition name: (identifier) @name) @target
     (class_definition name: (identifier) @name) @target] @def
  type_definitions: |
    (class_definition name: (identifier) @name) @type
  calls: |
    (call function: (identifier) @callee)
    (call function: (attribute object: (_) @receiver attribute: (identifier) @member))
  local_receivers: ["self", "cls"]
  imports:
    - query: |
        (import_from_statement module_name: (_) @module (dotted_name (identifier) @imported))
      exposure: module
    - query: |
        (import_from_statement module_name: (_) @module
          (aliased_import name: (dotted_name (identifier) @imported) alias: (identifier) @alias))
      exposure: module
    - query: |
        (import_from_statement module_name: (_) @module (wildcard_import) @imported)
      exposure: module
  namespace_imports:
    - |
      (import_statement (dotted_name) @module)
    - |
      (import_statement (aliased_import name: (dotted_name) @module alias: (identifier) @alias))
  namespace_binds: whole
  qualified_uses: |
    (attribute object: [(identifier) (attribute)] @qualifier attribute: (identifier) @name)

javascript:
  extensions: [".js", ".jsx", ".mjs", ".cjs"]
  unqualified_call_scope: file
  resolution_languages: [javascript]
  module_entries: ["index.js", "index.jsx", "index.mjs", "index.cjs"]
  grammar: [tree_sitter_javascript, language]
  definitions: |
    [(function_declaration name: (identifier) @name) @target
     (class_declaration name: (identifier) @name) @target
     (method_definition name: (property_identifier) @name) @target
     (variable_declarator name: (identifier) @name value: [(arrow_function) (function_expression)]) @target
     (assignment_expression
       left: (member_expression
         object: (identifier) @exports
         property: (property_identifier) @name)
       right: [(function_expression) (arrow_function)]
       (#eq? @exports "exports")) @target
     (assignment_expression
       left: (member_expression
         object: (member_expression
           object: (identifier) @module
           property: (property_identifier) @exports)
         property: (property_identifier) @name)
       right: [(function_expression) (arrow_function)]
       (#eq? @module "module")
       (#eq? @exports "exports")) @target] @def
  type_definitions: |
    (class_declaration name: (identifier) @name) @type
  calls: |
    (call_expression function: (identifier) @callee)
    (call_expression function: (member_expression object: (_) @receiver property: (property_identifier) @member))
  local_receivers: ["this"]
  local_receiver_roots: |
    (method_definition) @root
  local_receiver_barriers: |
    [(function_declaration) (function_expression)] @barrier
  imports:
    - |
      (import_statement
        (import_clause (named_imports (import_specifier name: (identifier) @imported !alias)))
        source: (string) @module)
    - |
      (import_statement
        (import_clause
          (named_imports
            (import_specifier name: (identifier) @imported alias: (identifier) @alias)))
        source: (string) @module)
    - query: |
        (import_statement (import_clause (identifier) @alias) source: (string) @module)
      imported: "default"
    - query: |
        (export_statement (export_clause (export_specifier name: (identifier) @imported !alias))
          source: (string) @module)
      exposure: module
    - query: |
        (export_statement
          (export_clause
            (export_specifier name: (identifier) @imported alias: (identifier) @alias))
          source: (string) @module)
      exposure: module
    - query: |
        (export_statement "*" source: (string) @module)
      imported: "*"
      exposure: module
    - |
      (variable_declarator
        name: (object_pattern (shorthand_property_identifier_pattern) @imported)
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require"))
    - |
      (variable_declarator
        name: (object_pattern
          (pair_pattern key: (property_identifier) @imported value: (identifier) @alias))
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require"))
  namespace_imports:
    - |
      (import_statement (import_clause (namespace_import (identifier) @alias))
        source: (string) @module)
    - |
      (variable_declarator
        name: (identifier) @alias
        value: (call_expression
          function: (identifier) @require
          arguments: (arguments (string) @module))
        (#eq? @require "require"))
  qualified_uses: |
    (member_expression object: [(identifier) (member_expression)] @qualifier
      property: (property_identifier) @name)
  default_exports: |
    (export_statement declaration: (function_declaration name: (identifier) @name))
    (export_statement declaration: (class_declaration name: (identifier) @name))
    (export_statement value: (identifier) @name)

