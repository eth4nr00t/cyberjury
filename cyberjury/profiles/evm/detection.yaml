skip_dirs:
  - ".git"
  - "__pycache__"
  - ".venv"
  - "venv"
  - "node_modules"
  - "artifacts"
  - "cache"
  - "out"
  - "broadcast"
  - "typechain"
  - "typechain-types"
  - "coverage"

skip_root_dirs:
  - "dependencies"
  - "lib"

analysis_output_dirs:
  - "artifacts"
  - "broadcast"
  - "cache"
  - "coverage"
  - "out"
  - "typechain"
  - "typechain-types"

source_extensions:
  - ".sol"

auto_select_extensions:
  - ".sol"

patch_extra_extensions: []

patch_names: []

config_extensions:
  - ".json"
  - ".toml"
  - ".yaml"
  - ".yml"

manifests:
  - "foundry.toml"
  - "remappings.txt"
  - "hardhat.config.js"
  - "hardhat.config.ts"
  - "package.json"
  - "truffle-config.js"

compile_roots:
  - "foundry.toml"
  - "hardhat.config.js"
  - "hardhat.config.ts"
  - "truffle-config.js"

fact_focus_flags:
  - "external_call"
  - "sends_eth"
  - "can_reenter"


patch_definition_patterns:
  - '\b(?:function|modifier)\s+([A-Za-z_]\w*)\s*\('
  - '\b(?:constructor|fallback|receive)\s*\('

patch_call_patterns:
  - '\b([A-Za-z_$][A-Za-z0-9_$]*)\s*\('

test_dirs:
  - "test"
  - "tests"

test_name_patterns:
  - "*.t.sol"
  - "*.test.sol"
  - "*.spec.sol"
  - "test_*"

doc_extensions:
  - ".adoc"
  - ".markdown"
  - ".md"
  - ".mdx"
  - ".rst"
  - ".txt"

lockfiles:
  - "soldeer.lock"
  - "package-lock.json"
  - "npm-shrinkwrap.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "bun.lock"
  - "bun.lockb"
  - "deno.lock"
